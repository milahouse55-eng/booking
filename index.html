<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MILA HOUSE</title>
<meta name="theme-color" content="#5A4F4D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MILA HOUSE">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap">
<style>html,body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: staff console — sticky header, tab bar (bottom on phone / top on desktop); booking screen = form column + sticky price summary */
:root{
  --bg:#F7F4F0; --surface:#FFFFFF; --surface-2:#EFEAE4; --line:#DFD7CF;
  --fg:#2A2422; --muted:#6F6560;
  --basil:#5A4F4D; --basil-ink:#F9F3F0; --pomodoro:#9C5B3E; --pomodoro-ink:#FFFFFF; --parm:#C2A07A;
  --head:#5A4F4D; --head-ink:#F9F3F0;
  --ok:#4E7558; --ok-bg:#E6EFE6; --warn:#9A6614; --warn-bg:#F7EBD6; --bad:#A8423A; --bad-bg:#F6E2DF;
  --event:#7B5468; --table:#5A4F4D;
  --shadow:0 10px 30px rgba(42,36,34,.13);
  --display:"Rubik","Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --body:"Rubik","Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171413; --surface:#201C1B; --surface-2:#2A2524; --line:#3A3331; --fg:#F3EDE8; --muted:#A99A92;
  --basil:#CDBFB4; --basil-ink:#1C1817; --pomodoro:#D79A7C; --pomodoro-ink:#1C1817; --parm:#D7B49A;
  --head:#2E2826; --head-ink:#F3EDE8;
  --ok:#7FB08B; --ok-bg:#1F2E23; --warn:#E0A955; --warn-bg:#362A17; --bad:#E88A80; --bad-bg:#3A221F;
  --event:#C49AB2; --table:#B7A79B; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171413; --surface:#201C1B; --surface-2:#2A2524; --line:#3A3331; --fg:#F3EDE8; --muted:#A99A92;
  --basil:#CDBFB4; --basil-ink:#1C1817; --pomodoro:#D79A7C; --pomodoro-ink:#1C1817; --parm:#D7B49A;
  --head:#2E2826; --head-ink:#F3EDE8;
  --ok:#7FB08B; --ok-bg:#1F2E23; --warn:#E0A955; --warn-bg:#362A17; --bad:#E88A80; --bad-bg:#3A221F;
  --event:#C49AB2; --table:#B7A79B; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;direction:rtl;padding-bottom:90px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--head)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--parm);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--head);color:var(--head-ink)}
header.top .wrap{display:flex;align-items:center;gap:14px;padding-block:9px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo{gap:14px}
.logo img{height:46px;width:auto;display:block;flex:none}
.logo .sub{font-size:12px;letter-spacing:.4px;opacity:.82;padding-inline-start:14px;border-inline-start:1px solid currentColor;line-height:1.2;white-space:nowrap}
@media (max-width:420px){.logo .sub{display:none}}
.tricolore{height:2px;background:linear-gradient(90deg,transparent,var(--parm) 20%,var(--parm) 80%,transparent);opacity:.9}.tricolore i{display:none}
.spacer{flex:1}
.me{font-size:12px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);white-space:nowrap;max-width:44vw;overflow:hidden;text-overflow:ellipsis}

nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav.tabs button{background:none;border:0;border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--basil);font-weight:700;background:var(--surface-2)}
nav.tabs button.cta{color:var(--pomodoro);font-weight:700}
@media (min-width:900px){
  body{padding-bottom:24px}
  nav.tabs{position:static;border:0;background:transparent;display:flex;gap:6px;padding:0;margin-top:16px}
  nav.tabs button{flex-direction:row;gap:8px;font-size:15px;padding:9px 16px;background:var(--surface);border:1px solid var(--line)}
  nav.tabs button svg{width:18px;height:18px}
  nav.tabs button[aria-current="page"]{background:var(--basil);color:var(--basil-ink);border-color:var(--basil)}
  nav.tabs button.cta:not([aria-current="page"]){border-color:var(--pomodoro)}
}
main{padding-block:16px 24px}
.view{display:grid;gap:16px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:clamp(26px,4vw,36px);font-weight:600;letter-spacing:0}
h2{font-size:20px;font-weight:600;letter-spacing:0}
h3{font-size:16px;font-weight:600;font-family:var(--body)}
.lede{color:var(--muted);margin:2px 0 0;max-width:66ch}
.eyebrow{font-size:12px;letter-spacing:1.2px;color:var(--pomodoro);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;align-content:start;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;gap:16px}
@media (min-width:900px){.grid2{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.btn:hover{border-color:var(--basil)}
.btn.primary{background:var(--basil);border-color:var(--basil);color:var(--basil-ink)}
.btn.red{background:var(--pomodoro);border-color:var(--pomodoro);color:var(--pomodoro-ink)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.lg{padding:12px 18px;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.note{font-size:12px;color:var(--muted)}
.btn.xl{border-color:var(--ok);color:var(--ok)}
.btn.xl:hover{background:var(--ok-bg)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:720px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-family:var(--display);font-size:28px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--muted)}

/* forms */
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.fgrid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.fgrid .full{grid-column:1/-1}
@media (max-width:560px){.fgrid,.fgrid.three{grid-template-columns:1fr 1fr}.fgrid .wide{grid-column:1/-1}}
label.f,.f{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;color:var(--fg);font-weight:400;font-size:15px;min-width:0}
textarea.inp{min-height:64px;resize:vertical}
.stepper{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.stepper button{border:0;background:var(--surface-2);width:40px;font-size:20px;font-weight:700}
.stepper input{border:0;background:transparent;text-align:center;width:100%;min-width:0;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;padding:6px 0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 11px;line-height:1.25;text-align:center}
.chips button small{display:block;font-size:11px;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips button[aria-pressed="true"] small{color:inherit;opacity:.75}
.chipgrid{display:flex;flex-wrap:wrap;gap:6px}
.chipgrid button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;font-size:13px;line-height:1.2}
.chipgrid button[aria-pressed="true"]{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.chipgrid.neutral button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chipgrid button svg{vertical-align:-2px;margin-inline-start:3px}
/* quick-jump step nav: keeps every section one tap away so nothing gets lost while scrolling */
.stepnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 48px);z-index:20;display:flex;gap:6px;overflow-x:auto;padding:8px 0;margin:-4px 0 0;background:var(--bg)}
.stepnav a{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px 6px 9px;font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;scroll-snap-align:start}
.stepnav a:hover,.stepnav a.active{color:var(--fg);border-color:var(--basil)}
.stepnav a i{width:19px;height:19px;border-radius:50%;background:var(--surface-2);color:var(--fg);display:grid;place-items:center;font-size:11px;font-weight:700;font-style:normal;flex:none}
.stepnav a.done i{background:var(--basil);color:var(--basil-ink)}
.suggest{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface-2);border:1px dashed var(--basil);border-radius:10px;padding:9px 12px;font-size:13px}
.suggest svg{flex:none;color:var(--basil)}
.help-step{display:flex;gap:12px;align-items:flex-start}
.help-step i{width:30px;height:30px;border-radius:50%;background:var(--basil);color:var(--basil-ink);display:grid;place-items:center;font-weight:700;font-style:normal;flex:none;font-family:var(--display)}
.help-step div b{display:block;margin-bottom:2px}
.help-step div span{color:var(--muted);font-size:13px}
.helpbtn{border:0;background:rgba(255,255,255,.18);color:inherit;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;font-size:14px}
#step1,#step2,#step3,#step4{scroll-margin-top:132px}
.seg{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:right;display:grid;gap:2px;min-width:0}
.opt b{font-size:15px}
.opt span{font-size:12px;color:var(--muted)}
.opt .p{font-weight:700;color:var(--basil);font-variant-numeric:tabular-nums}
.opt[aria-pressed="true"]{border-color:var(--basil);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--basil)}
.checks{display:grid;gap:6px}
.check{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.check input[type=checkbox]{width:18px;height:18px;accent-color:var(--basil);flex:none}
.check .grow{flex:1;min-width:0}
.check small{color:var(--muted);display:block;font-size:12px}
.check .p{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.mini{width:64px;flex:none;text-align:center}

/* availability */
.section-h{display:flex;align-items:center;gap:10px}
.section-h .n{width:26px;height:26px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.areas{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.area{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);text-align:right;display:grid;gap:6px;min-width:0}
.area .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.area b{font-size:15px;display:inline-flex;align-items:center;gap:7px}
.area b svg{flex:none;opacity:.8}
.area .bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex}
.area .bar i{display:block;height:100%}
.area .bar .used{background:var(--muted);opacity:.55}
.area .bar .new{background:var(--basil)}
.area.full .bar .new{background:var(--bad)}
.area .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.area[aria-pressed="true"]{border-color:var(--basil);box-shadow:inset 0 0 0 1.5px var(--basil);background:var(--surface-2)}
.area.full{opacity:.75}
.badge{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.bad{background:var(--bad-bg);color:var(--bad)}
.verdict{border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-weight:600}
.verdict.ok{background:var(--ok-bg);color:var(--ok)}.verdict.bad{background:var(--bad-bg);color:var(--bad)}.verdict.warn{background:var(--warn-bg);color:var(--warn)}
.verdict svg{flex:none}

/* summary paper */
.paper{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 152px)}
.paper .ph{background:var(--fg);color:var(--bg);padding:12px 16px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.paper .ph h3{color:inherit}
.paper .ph small{opacity:.75}
.paper .pb{padding:12px 16px 16px;display:grid;gap:10px}
.lines{width:100%;border-collapse:collapse;font-size:14px}
.lines td{padding:6px 0;border-bottom:1px dashed var(--line);vertical-align:top}
.lines td:last-child{text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums;padding-inline-start:10px}
.lines td small{display:block;color:var(--muted);font-size:12px}
.lines tr.sum td{border-bottom:0;color:var(--muted);padding:3px 0}
.lines tr.total td{border-top:2px solid var(--fg);border-bottom:0;font-family:var(--display);font-weight:700;font-size:24px;padding-top:10px}
.pp{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);background:var(--surface-2);padding:7px 10px;border-radius:8px}
.pp b{color:var(--fg);font-variant-numeric:tabular-nums}
.reqchips{display:flex;gap:5px;flex-wrap:wrap}
.rq{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--warn-bg);color:var(--warn);font-weight:600;white-space:nowrap}
.rq.al{background:var(--bad-bg);color:var(--bad)}
@media (max-width:899px){.paper{position:static}}
.savebar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:25;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.savebar .in{background:var(--fg);color:var(--bg);border-radius:14px;padding:9px 10px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
.savebar b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.savebar small{display:block;font-size:11px;opacity:.75}
body.has-save{padding-bottom:160px}
@media (min-width:900px){.savebar{display:none}body.has-save{padding-bottom:24px}}

/* dish picker */
.dishes{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.dish{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:6px;background:var(--surface)}
.dish .pic{width:62px;height:48px;border-radius:8px;overflow:hidden}
.dish .pic svg{width:100%;height:100%;display:block}
.dish b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dish span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.qty button{background:var(--surface-2);border:0;width:28px;height:28px;font-size:17px;line-height:1}
.qty span{min-width:24px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.addbtn{border:1px solid var(--basil);color:var(--basil);background:transparent;border-radius:9px;width:30px;height:30px;font-size:18px;font-weight:700}
details.fold{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.fold>summary{cursor:pointer;padding:10px 12px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"＋";color:var(--muted)}
details.fold[open]>summary::after{content:"－"}
details.fold>div{padding:0 12px 12px;display:grid;gap:10px}

/* booking rows */
.list{display:grid;gap:8px}
.bk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:right;width:100%}
.bk:hover{border-color:var(--basil)}
.bk .t{font-variant-numeric:tabular-nums;font-weight:700;min-width:54px;text-align:center;border-inline-end:1px solid var(--line);padding-inline-end:12px}
.bk .t small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.bk .main{min-width:0;display:grid;gap:3px}
.bk .main b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk .main .sub{font-size:13px;color:var(--muted)}
.bk .side{display:grid;gap:4px;justify-items:end}
.bk .val{font-weight:700;font-variant-numeric:tabular-nums}
.bk.cancel{opacity:.55}
.bk.cancel .main b{text-decoration:line-through}
.st{font-size:12px;padding:2px 8px;border-radius:6px;white-space:nowrap;font-weight:600}
.st.s0{background:var(--warn-bg);color:var(--warn)}.st.s1{background:var(--ok-bg);color:var(--ok)}.st.s2{background:var(--ok);color:var(--surface)}.st.s3{background:var(--surface-2);color:var(--muted)}.st.s4{background:var(--bad-bg);color:var(--bad)}
.kind{font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;border:1px solid currentColor}
.kind.ev{color:var(--event)}.kind.tb{color:var(--table)}
.empty{color:var(--muted);text-align:center;padding:20px;border:1px dashed var(--line);border-radius:12px}

/* calendar */
.calhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.calhead h2{min-width:140px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:12px;color:var(--muted);text-align:center;font-weight:600;padding:2px 0}
.day{min-height:92px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:3px;text-align:right;overflow:hidden;min-width:0}
.day.out{opacity:.38}
.day.today .dn{background:var(--pomodoro);color:var(--pomodoro-ink);border-radius:99px;padding:0 7px}
.day[aria-pressed="true"]{border-color:var(--basil);box-shadow:inset 0 0 0 1.5px var(--basil)}
.dn{font-weight:700;font-size:13px;align-self:flex-start;font-variant-numeric:tabular-nums}
.day .g{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.day .m{font-size:12px;color:var(--basil);font-weight:700;font-variant-numeric:tabular-nums}

/* timeline */

.tl{min-width:720px;display:grid;grid-template-columns:110px 1fr}
.tl .lab{padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600;display:flex;flex-direction:column;justify-content:center;gap:2px;background:var(--surface-2)}

.tl .lane{position:relative;border-bottom:1px solid var(--line);min-height:52px;background-image:linear-gradient(to left,var(--line) 1px,transparent 1px);background-size:calc(100%/13) 100%}
.tl .hours{position:relative;height:24px;border-bottom:1px solid var(--line)}

.blk{position:absolute;top:6px;bottom:6px;border-radius:7px;padding:2px 6px;font-size:11px;line-height:1.3;color:var(--surface);background:var(--table);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border:0;text-align:right}

/* prep */

/* modal / toast */

.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;box-shadow:var(--shadow)}

.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px}

.settings-row{display:grid;grid-template-columns:minmax(0,1.4fr) 90px auto;gap:8px;align-items:center}
/* ---- v8: phone-call booking, today dashboard, splash ---- */
.hello{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.hello h1{font-size:clamp(30px,4.6vw,42px)}
.cta-new{padding:14px 22px;font-size:17px;border-radius:14px;box-shadow:0 8px 22px color-mix(in srgb,var(--pomodoro) 28%,transparent)}
.alerts{display:grid;gap:6px}

.alert .dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--warn)}

.panel-fold{background:var(--surface)}
.modes{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.modes button{border:0;background:transparent;padding:10px 16px;font-weight:600;font-size:15px;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--basil);color:var(--basil-ink)}

.callcard{gap:16px}

.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
.slot{border:1.5px solid var(--line);background:var(--surface);border-radius:11px;padding:7px 4px;display:grid;line-height:1.2}

.slot[aria-pressed="true"] small{color:inherit;opacity:.85}
.slot[aria-pressed="true"] b{text-decoration:none}
.inp.big{font-size:18px;padding:12px 13px}
.fgrid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:700px){.fgrid.four{grid-template-columns:1fr 1fr}}
.cust{border:1px solid var(--basil);background:var(--surface-2);border-radius:12px;padding:10px 12px;display:grid;gap:8px;justify-items:start}
.cust .ctop{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}

.sugg small{display:block;color:var(--muted);font-size:12px}
.st-pick button[aria-pressed="true"]{background:var(--basil);border-color:var(--basil);color:var(--basil-ink)}
details.fold-panel{padding:0;gap:0}

details.fold-panel[open]>summary::after{content:"－"}
.fold-body{padding:0 16px 16px;display:grid;gap:12px}
.say{background:var(--surface-2);border-inline-start:3px solid var(--parm);border-radius:8px;padding:9px 12px}

:root[data-theme="dark"] .btn.wa{border-color:#5FC88A;color:#5FC88A}
.st.sh{background:color-mix(in srgb,var(--pomodoro) 16%,transparent);color:var(--pomodoro)}
.settings-row.two{grid-template-columns:minmax(0,1fr) 150px}
.cap{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}

@media (max-width:560px){.extra-row{grid-template-columns:minmax(0,1fr) 80px 36px}.extra-row select{grid-column:1/3}.pkg-row{grid-template-columns:minmax(0,1fr) 120px 36px}}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}

.splash{position:fixed;inset:0;z-index:120;background:var(--head);display:grid;place-items:center;transition:opacity .6s ease,visibility .6s}
.splash.out{opacity:0;visibility:hidden}
.splash .in{display:grid;justify-items:center;gap:18px}

.splash i{display:block;height:1px;width:0;background:var(--parm)}
@media (prefers-reduced-motion:no-preference){.splash img{animation:spIn .9s cubic-bezier(.2,.7,.2,1) .1s forwards}.splash i{animation:spLine .9s ease-out .35s forwards}
 @keyframes spIn{to{opacity:1;transform:none}}@keyframes spLine{to{width:150px}}}
@media (prefers-reduced-motion:reduce){.splash img{opacity:1;transform:none}.splash i{width:150px}}
/* ---- v9: allergies, reminders, hours ---- */

.allergy-box{border-width:1.5px}

.levels{display:flex;gap:6px;flex-wrap:wrap}
.levels button{border:1.5px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 14px;font-weight:600;font-size:14.5px}
.levels button.lv-sens[aria-pressed="true"]{background:#FBF3D0;border-color:#C9A227;color:#7A5B00}

.cust-warn{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:6px 10px;font-size:13.5px;font-weight:600}
.cust-al{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-radius:10px;padding:8px 10px;background:var(--warn-bg);color:var(--warn);font-size:14px;width:100%}

.brief-list{display:grid;gap:6px}

@media (max-width:560px){.hours-row{grid-template-columns:52px 72px 1fr auto 1fr}.cd-add{grid-template-columns:1fr auto}.cd-add .inp:first-child{grid-column:1/-1}}
.nudges{position:fixed;z-index:70;top:calc(env(safe-area-inset-top,0px) + 74px);left:max(12px,env(safe-area-inset-left,0px));width:min(380px,calc(100% - 24px));display:grid;gap:8px;pointer-events:none}

}

<header class="top">

// peak seated guests in an area during [start,end); a "buyout" booking takes the whole area
function areaUse(date,time,dur,areaId,excludeId){
  const a=cfgArea(areaId);if(!a)return{used:0,list:[]};const s=mins(time),e=s+(+dur||state.cfg.dur);const g=b=>b.buyout?a.cap:(+b.guests||0);
  const list=state.bookings.filter(b=>b.date===date&&b.area===areaId&&b.id!==excludeId&&!isCancel(b)).filter(b=>{const bs=mins(b.time),be=bs+(+b.dur||state.cfg.dur);return bs<e&&be>s});
  if(a.exclusive)return{used:list.length?a.cap:0,list};
  const pts=[s,...list.map(b=>mins(b.time)).filter(p=>p>s&&p<e)];let peak=0;
  for(const p of pts){const sum=list.filter(b=>{const bs=mins(b.time),be=bs+(+b.dur||state.cfg.dur);return bs<=p&&be>p}).reduce((t,b)=>t+g(b),0);peak=Math.max(peak,sum)}
  return{used:Math.min(peak,a.cap*2),list};
}
function availability(d){
  return state.cfg.areas.map(a=>{const u=areaUse(d.date,d.time,d.dur,a.id,d.id);const free=Math.max(0,a.cap-u.used);const g=+d.guests||0;const need=d.buyout?a.cap:g;
    const fits=g>0&&g<=a.cap&&need<=free;const after=u.used+need;const level=!fits?"bad":after/a.cap>.85?"warn":"ok";return{...a,used:u.used,free,fits,level,list:u.list}});
}
/* opening hours */
function hoursFor(date){const cd=(state.cfg.closedDates||[]).find(x=>x.date===date);if(cd)return{closed:true,note:cd.note||"",special:true,open:"12:00",close:"23:00"};
  const h=(state.cfg.hours||[])[dObj(date).getDay()]||{};return{closed:!!h.closed,open:h.open||"12:00",close:h.close||"23:00",note:""}}
function slotList(date,override){const h=hoursFor(date||state.draft.date);if(h.closed&&!override)return[];const o=h.closed?{open:"12:00",close:"23:00"}:h;
  let a=mins(o.open),e=mins(o.close)-60;if(mins(o.close)<=a)e=23*60+30;e=Math.min(e,23*60+30);a=Math.ceil(a/30)*30;const out=[];for(let m=a;m<=e;m+=30)out.push(hhmm(m));return out.length?out:[hhmm(a)]}
const dayClosed=d=>hoursFor(d.date).closed&&!d.openOverride;
const outOfHours=d=>!dayClosed(d)&&!slotList(d.date,d.openOverride).includes(d.time);
function suggestTimes(d){
  const base=mins(d.time),out=[];
  for(const tt of slotList(d.date,d.openOverride).filter(x=>x!==d.time).sort((a,b)=>Math.abs(mins(a)-base)-Math.abs(mins(b)-base))){
    const av=availability({...d,time:tt}).filter(a=>a.fits);if(av.length)out.push({time:tt,areas:av.map(a=>a.name)});if(out.length>=4)break}
  return out.sort((a,b)=>mins(a.time)-mins(b.time));
}
function calc(b){
  const c=state.cfg,g=Math.max(0,+b.guests||0),kids=Math.min(g,Math.max(0,+b.kids||0)),adults=g-kids,lines=[];
  const pkg=c.packages.find(p=>p.id===b.pkg);
  if(pkg)lines.push({label:pkg.name,sub:`${adults} × ${nis(pkg.pp)}`,amt:adults*pkg.pp});
  else lines.push({label:"הערכת הוצאה לסועד",sub:`${adults} × ${nis(c.estSpend)}`,amt:adults*c.estSpend});
  if(kids)lines.push({label:"תפריט ילדים",sub:`${kids} × ${nis(c.kidsPrice)}`,amt:kids*c.kidsPrice});
  for(const id of b.extras||[]){const x=c.extras.find(e=>e.id===id);if(x)lines.push({label:x.name,sub:x.unit==="pp"?`${adults} × ${nis(x.price)}`:"",amt:x.unit==="pp"?x.price*adults:x.price})}
  const sub=lines.reduce((a,l)=>a+l.amt,0),disc=Math.round(sub*Math.min(50,Math.max(0,+b.discount||0))/100);
  const service=b.service?Math.round((sub-disc)*c.service/100):0,total=sub-disc+service;
  const deposit=Math.round(total*c.depositPct/100),paid=+b.depositPaid||0;
  return{lines,sub,disc,service,total,pp:g?total/g:0,deposit,paid,balance:total-paid,pkg};
}

function dayStats(date){const l=state.bookings.filter(b=>b.date===date&&!isCancel(b));
  return{list:l,guests:l.reduce((a,b)=>a+(+b.guests||0),0),value:l.reduce((a,b)=>a+(+b.total||0),0),events:l.filter(isEvent),paid:l.reduce((a,b)=>a+(+b.depositPaid||0),0),req:l.filter(hasReq).length}}
/* hold-until-deposit */
const holdMs=()=>(+state.cfg.holdHours||48)*3600e3;
function holdInfo(b){if(b.status!==HOLD||!b.holdUntil)return null;const left=b.holdUntil-Date.now();return{until:b.holdUntil,expired:left<=0,soon:left>0&&left<24*3600e3}}
function fmtHold(ms){const d=new Date(ms);return "יום "+DAYS[d.getDay()]+" "+pad(d.getHours())+":"+pad(d.getMinutes())}
function applyStatus(rec,status,prev){rec.status=status;if(status===HOLD){if(!rec.holdUntil||prev!==HOLD)rec.holdUntil=Date.now()+holdMs()}else delete rec.holdUntil;return rec}
/* customers (built from past bookings) */
const digits=s=>String(s||"").replace(/\D/g,"");
function customerIndex(excludeId){const m=new Map();
  for(const b of state.bookings){if(b.id===excludeId)continue;const k=digits(b.phone);if(k.length<7)continue;const c=m.get(k)||{phone:b.phone,name:b.name,visits:0,last:null,lastB:null,cancels:0,noShows:0,al:null};
    if(isCancel(b))c.cancels++;else if(b.status===NOSHOW)c.noShows++;else c.visits++;
    if(!c.last||b.date>c.last){c.last=b.date;c.lastB=b;c.name=b.name;c.phone=b.phone}
    const r=b.req||{};if(allergyList(r).length){c.al=c.al||{tags:new Set(),text:"",level:"",who:""};(r.allergyTags||[]).forEach(t=>c.al.tags.add(t));if(r.allergies&&r.allergies.trim())c.al.text=r.allergies.trim();
      const lv=alLevel(r);if((LEVEL_RANK[lv]||0)>(LEVEL_RANK[c.al.level]||0))c.al.level=lv;if(r.allergyWho)c.al.who=r.allergyWho}
    m.set(k,c)}
  return m}
function waHref(phone,text){let n=digits(phone);if(n.startsWith("0"))n="972"+n.slice(1);if(n.length<11||n.length>13)return"";return"https://wa.me/"+n+"?text="+encodeURIComponent(text)}
const WA_ICON=`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21l1.7-5A8.5 8.5 0 1 1 8 19.4z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 .8a4 4 0 0 1-1.8-1.8l.8-1-1-2z"/></svg>`;
const CAL_ICON=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M12 14v4M10 16h4"/></svg>`;
function remindText(b){return`שלום ${b.name}, תזכורת מ-MILA HOUSE: מחכים לכם מחר, ${fmtDate(b.date)} בשעה ${b.time}, ${b.guests} סועדים. נשמח לאישור הגעה 🙏`}

function stBadge(b){const h=holdInfo(b);if(h&&h.expired)return`<span class="st s4">השמירה פגה</span>`;return`<span class="st ${stClass(b.status)}">${esc(b.status)}</span>`}
function bkRow(b,showDate=true){
  const ar=cfgArea(b.area),ev=isEvent(b);return`<button class="bk${isCancel(b)?" cancel":""}${isSevere(b)?" severe":""}" data-open="${esc(b.id)}"><div class="t">${esc(b.time)}${showDate?`<small>${shortDate(b.date)}</small>`:""}</div>
   <div class="main"><b>${esc(b.name)}</b><span class="sub">${b.guests} איש · ${esc(ar?ar.name:"")}${b.buyout?" · סגירת מקום":""}${b.occasion?" · "+esc(b.occasion):""}</span>${hasReq(b)?`<div class="reqchips">${reqChips(b)}</div>`:""}</div>
   <div class="side"><span class="kind ${ev?"ev":"tb"}">${ev?"אירוע":"שולחן"}</span>${ev?`<span class="val">${nis(b.total)}</span>`:""}${stBadge(b)}</div></button>`}

function greeting(){const h=new Date().getHours();return h>=5&&h<12?"בוקר טוב":h>=12&&h<17?"צהריים טובים":h>=17&&h<22?"ערב טוב":"לילה טוב"}
function alertsFor(t){const out=[];const up=state.bookings.filter(b=>b.date>=t&&!isCancel(b));
  for(const b of up){const h=holdInfo(b);
    if(h&&h.expired)out.push({lvl:"bad",b,txt:"השמירה פגה – לחזור ללקוח על המקדמה"});
    else if(h&&h.soon)out.push({lvl:"warn",b,txt:"השמירה פגה "+fmtHold(h.until)});
    else if(b.status==="ממתין לאישור")out.push({lvl:"warn",b,txt:"ממתין לאישור – לחזור ללקוח"});
    else if(isEvent(b)&&b.date<=addDays(t,14)&&!(+b.depositPaid)&&!["מקדמה שולמה","הגיעו",HOLD].includes(b.status))out.push({lvl:"warn",b,txt:"אירוע קרוב בלי מקדמה"})}
  const rank={bad:0,warn:1};return out.sort((a,b)=>rank[a.lvl]-rank[b.lvl]||(a.b.date+a.b.time).localeCompare(b.b.date+b.b.time)).slice(0,8)}
function allergyBrief(list,title){
  const al=list.filter(b=>allergyList(b.req).length).sort((a,b)=>(LEVEL_RANK[alLevel(b.req)]-LEVEL_RANK[alLevel(a.req)])||a.time.localeCompare(b.time));
  const tot={};list.forEach(b=>{(b.req&&b.req.allergyTags||[]).forEach(t=>tot[t]=(tot[t]||0)+1)});
  const diet=list.reduce((o,b)=>{const r=b.req||{};o.veg+=+r.veg||0;o.vegan+=+r.vegan||0;o.gf+=+r.gf||0;return o},{veg:0,vegan:0,gf:0});
  return`<div class="panel brief"><div class="row"><h2>${title}</h2><span class="spacer"></span><button class="btn sm noprint" data-act="print-brief">הדפסה</button></div>
   ${al.length?`<div class="brief-list">${al.map(b=>{const r=b.req,k=alLevel(r),ar=cfgArea(b.area);return`<button class="brief-row lv-${k}" data-open="${esc(b.id)}"><span class="lvl">${LEVELS[k].i} ${LEVELS[k].l}</span><span class="tm">${esc(b.time)}</span><span class="who"><b>${esc(allergyList(r).join(", "))}</b><small>${esc(b.name)} · ${b.guests} איש · ${esc(ar?ar.name:"")}${r.allergyWho?" · <b>"+esc(r.allergyWho)+"</b>":""}</small></span></button>`}).join("")}</div>`:`<p class="note">אין אלרגיות רשומות.</p>`}
   <p class="note brief-tot">${Object.entries(tot).map(([k,v])=>`${esc(k)}: ${v}`).join(" · ")}${Object.keys(tot).length?" · ":""}צמחוני ${diet.veg} · טבעוני ${diet.vegan} · ללא גלוטן ${diet.gf}</p></div>`}

    <span class="spacer"></span><button class="btn red lg cta-new" data-tab="new"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>הזמנה חדשה</button></div>
   ${severe.length?`<div class="severe-banner">${severe.map(b=>`<button data-open="${esc(b.id)}">🔴 <b>${esc(b.time)} · ${esc(b.name)}</b> · ${esc(allergyList(b.req).join(", "))} · מסכן חיים${b.req.allergyWho?" · "+esc(b.req.allergyWho):""}</button>`).join("")}</div>`:""}
   <div class="stats">

    <div class="stat"><div class="k">ההגעה הבאה</div><div class="v">${next?esc(next.time):"—"}</div><div class="s">${next?`${esc(next.name)} · ${next.guests} איש`:"אין הגעות נוספות היום"}</div></div>
    <div class="stat"><div class="k">אלרגיות היום</div><div class="v" style="color:${allergic.length?"var(--bad)":"inherit"}">${allergic.length}</div><div class="s">${allergic.length?"בתדריך למטה":"אין"}</div></div>

function timeline(date){
  const START=11*60,SPAN=13*60;const l=state.bookings.filter(b=>b.date===date&&!isCancel(b));
  const hours=Array.from({length:14},(v,i)=>`<span style="right:${(i/13*100).toFixed(2)}%">${pad(11+i>23?(11+i-24):11+i)}:00</span>`).join("");
  const lanes=state.cfg.areas.map(a=>{const bl=l.filter(b=>b.area===a.id).sort((x,y)=>mins(x.time)-mins(y.time));const ends=[];
    const blocks=bl.map(b=>{const s=mins(b.time),d=+b.dur||state.cfg.dur;let row=ends.findIndex(e=>e<=s);if(row<0){row=ends.length;ends.push(0)}ends[row]=s+d;
      const r=Math.max(0,(s-START)/SPAN*100),w=Math.min(100-r,d/SPAN*100);
      return`<button class="blk${isEvent(b)?" ev":""}${row%2?" stack1":""}" data-open="${esc(b.id)}" style="right:${r.toFixed(2)}%;width:${w.toFixed(2)}%;${ends.length>1?"bottom:auto;height:20px;"+(row%2?"":"top:5px;"):""}" title="${esc(b.name)}"><b>${b.guests} · ${esc(b.name)}</b>${ends.length>1?"":esc(b.time)}</button>`}).join("");
    return`<div class="lab"><span class="labname">${areaIcon(a.id)}${esc(a.name)}</span><small>${a.cap} מקומות</small></div><div class="lane" style="${ends.length>1?"min-height:58px":""}">${blocks}</div>`}).join("");
  return`<div class="tl-wrap"><div class="tl"><div class="lab" style="background:transparent"></div><div class="hours">${hours}</div>${lanes}</div></div>`;
}
function prepSheet(list){
  const c=state.cfg,pk={},diet={veg:0,vegan:0,gf:0,baby:0},al=[],cakes=[],notes=[];
  for(const b of list){const p=c.packages.find(x=>x.id===b.pkg);if(p){pk[p.name]=(pk[p.name]||0)+(+b.guests-(+b.kids||0))}if(+b.kids)pk["תפריט ילדים"]=(pk["תפריט ילדים"]||0)+(+b.kids);
    const r=b.req||{};diet.veg+=+r.veg||0;diet.vegan+=+r.vegan||0;diet.gf+=+r.gf||0;diet.baby+=+r.baby||0;
    const alg=allergyList(r);if(alg.length){const k=alLevel(r);al.push(`${LEVELS[k].i} ${esc(b.time)} ${esc(b.name)}: ${esc(alg.join(", "))} (${LEVELS[k].l}${r.allergyWho?", "+esc(r.allergyWho):""})`)}
    if(r.cake||(b.extras||[]).includes("x2"))cakes.push(`${esc(b.time)} ${esc(b.name)}`);if(r.notes)notes.push(`${esc(b.time)} ${esc(b.name)}: ${esc(r.notes)}`)}
  const ul=(o)=>Object.keys(o).length?`<ul>${Object.entries(o).map(([k,v])=>`<li><span>${esc(k)}</span><b>${v}</b></li>`).join("")}</ul>`:`<p class="note">אין</p>`;
  const ll=a=>a.length?`<ul>${a.map(x=>`<li><span>${x}</span></li>`).join("")}</ul>`:`<p class="note">אין</p>`;
  return`<div class="prep"><div><h3>מנות לפי חבילות</h3>${ul(pk)}</div>
   <div><h3>תזונה מיוחדת</h3><ul><li><span>צמחוני</span><b>${diet.veg}</b></li><li><span>טבעוני</span><b>${diet.vegan}</b></li><li><span>ללא גלוטן</span><b>${diet.gf}</b></li><li><span>כיסאות תינוק</span><b>${diet.baby}</b></li></ul></div>
   <div><h3 style="color:var(--bad)">אלרגיות</h3>${ll(al)}</div><div><h3>עוגות / הפתעות</h3>${ll(cakes)}</div><div><h3>הערות לצוות</h3>${ll(notes)}</div></div>`;
}

  let l=state.bookings.filter(b=>{if(state.listFilter==="upcoming"&&b.date<t)return false;if(state.listFilter==="past"&&b.date>=t)return false;if(state.listFilter==="pending"&&b.status!=="ממתין לאישור")return false;if(state.listFilter==="events"&&!isEvent(b))return false;
    if(q&&!((b.name||"").toLowerCase().includes(q)||(b.phone||"").replace(/-/g,"").includes(q)))return false;return true});
  l.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));if(state.listFilter==="past")l.reverse();state.listRes=l;
  const val=l.filter(b=>!isCancel(b)).reduce((a,b)=>a+(+b.total||0),0);
  return`<section class="view"><div><span class="eyebrow">כל ההזמנות</span><h1>חיפוש הזמנה</h1><p class="lede">לקוח מתקשר לשנות? חפשו לפי שם או טלפון.</p></div>

    <div class="filters">${[["upcoming","קרובות"],["events","אירועים"],["pending","ממתינות"],["past","עבר"],["all","הכול"]].map(([k,lab])=>`<button data-lf="${k}" aria-pressed="${state.listFilter===k}">${lab}</button>`).join("")}</div>

    <div class="list" id="listRes">${l.length?l.map(b=>bkRow(b)).join(""):`<div class="empty">לא נמצאו הזמנות.</div>`}</div></div></section>`;
}

function readCfgForm(){const f=$("#cfgForm"),base=clone(state.cfgEdit||state.cfg);if(!f)return base;const fd=new FormData(f);
  base.areas=base.areas.map((a,i)=>({...a,name:(fd.get("a-n-"+i)||"").trim()||a.name,cap:Math.max(1,+fd.get("a-c-"+i)||a.cap),exclusive:false}));
  base.packages=base.packages.map((p,i)=>({...p,name:(fd.get("p-n-"+i)||"").trim(),pp:+fd.get("p-p-"+i)||0,desc:(fd.get("p-d-"+i)||"").trim()}));
  base.extras=base.extras.map((x,i)=>({...x,name:(fd.get("e-n-"+i)||"").trim(),price:+fd.get("e-p-"+i)||0,unit:fd.get("e-u-"+i)==="pp"?"pp":"flat"}));
  for(const k of["dur","estSpend","kidsPrice","service","depositPct","eventFrom","holdHours","remindMins"]){const v=fd.get(k);if(v!==null)base[k]=+v||0}
  base.hours=base.hours.map((h,i)=>fd.get("h-o-"+i)===null?h:{closed:fd.get("h-c-"+i)==="on",open:fd.get("h-o-"+i)||h.open,close:fd.get("h-e-"+i)||h.close});
  base.v=CFG_V;return base}

function confirmText(b){const c=calc(b),ar=cfgArea(b.area);
  let t=`MILA HOUSE – אישור הזמנה\n${b.name}\n${fmtDate(b.date)} בשעה ${b.time}\n${b.guests} סועדים${ar?" · "+ar.name:""}\n`;
  if(isEvent(b)&&b.pkg!=="est"){t+="\n";c.lines.forEach(l=>t+=`• ${l.label}${l.sub?" ("+l.sub+")":""}: ${nis(l.amt)}\n`);if(c.disc)t+=`הנחה: -${nis(c.disc)}\n`;if(c.service)t+=`שירות ${state.cfg.service}%: ${nis(c.service)}\n`;t+=`סה"כ: ${nis(c.total)} (כולל מע"מ)\nמקדמה: ${nis(c.deposit)}${c.paid?` · שולם ${nis(c.paid)}`:""}\n`}
  if(b.status===HOLD)t+=`\nההזמנה שמורה עד ${fmtHold(b.holdUntil||Date.now()+holdMs())}, ותיסגר סופית עם תשלום המקדמה.\n`;
  const alg=allergyList(b.req);if(alg.length)t+=`\nרשמנו אצלנו: ${alg.join(", ")}\n`;return t+"\nמחכים לכם! לשינויים חייגו אלינו."}

const XL_ICON=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>`;
/* ================= EXCEL EXPORT (self-contained .xlsx writer, no library) ================= */
const XLSX_W={
  crcT:null,
  crc(b){if(!this.crcT){this.crcT=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;this.crcT[n]=c>>>0}}
    let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=this.crcT[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0},
  zip(files){const enc=new TextEncoder(),parts=[],cen=[];let off=0;
    for(const[name,txt]of files){const nb=enc.encode(name),db=enc.encode(txt),crc=this.crc(db);
      const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint32(14,crc,true);lh.setUint32(18,db.length,true);lh.setUint32(22,db.length,true);lh.setUint16(26,nb.length,true);
      const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint32(16,crc,true);ch.setUint32(20,db.length,true);ch.setUint32(24,db.length,true);ch.setUint16(28,nb.length,true);ch.setUint32(42,off,true);
      parts.push(new Uint8Array(lh.buffer),nb,db);cen.push(new Uint8Array(ch.buffer),nb);off+=30+nb.length+db.length}
    const cs=cen.reduce((a,b)=>a+b.length,0),end=new DataView(new ArrayBuffer(22));end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cs,true);end.setUint32(16,off,true);
    return new Blob([...parts,...cen,new Uint8Array(end.buffer)],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})},
  x:s=>String(s??"").replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),
  col(i){let s="";i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s},
  serial(isoDate){const[y,m,d]=String(isoDate).split("-").map(Number);if(!y||!m||!d)return null;return(Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/86400000},
  /* sheet: {name, cols:[{h,w,t}], rows:[[...]] } t: "s" text | "n" number | "c" currency | "d" ISO date */
  sheetXml(sh){const R=[];
    R.push(`<row r="1">${sh.cols.map((c,i)=>`<c r="${this.col(i)}1" s="1" t="inlineStr"><is><t>${this.x(c.h)}</t></is></c>`).join("")}</row>`);
    sh.rows.forEach((row,ri)=>{const r=ri+2;R.push(`<row r="${r}">${row.map((v,i)=>{const ref=this.col(i)+r,t=sh.cols[i].t;
      if(v===""||v==null)return"";
      if(t==="d"){const s=this.serial(v);return s==null?`<c r="${ref}" t="inlineStr"><is><t>${this.x(v)}</t></is></c>`:`<c r="${ref}" s="2"><v>${s}</v></c>`}
      if((t==="n"||t==="c")&&isFinite(+v))return`<c r="${ref}"${t==="c"?' s="3"':""}><v>${+v}</v></c>`;
      return`<c r="${ref}" s="4" t="inlineStr"><is><t xml:space="preserve">${this.x(v)}</t></is></c>`}).join("")}</row>`)});
    if(sh.totals)R.push(`<row r="${sh.rows.length+2}">${sh.totals.map((v,i)=>{const ref=this.col(i)+(sh.rows.length+2);if(v===""||v==null)return"";
      if(typeof v==="number")return`<c r="${ref}" s="${sh.cols[i].t==="c"?6:5}"><v>${v}</v></c>`;return`<c r="${ref}" s="5" t="inlineStr"><is><t>${this.x(v)}</t></is></c>`}).join("")}</row>`);
    const last=this.col(sh.cols.length-1)+(sh.rows.length+1);

document.addEventListener("click",async ev=>{
  unlockAudio();const ra=ev.target.closest("a[data-remind]");if(ra){const b=state.bookings.find(x=>x.id===ra.dataset.remind);if(b)setTimeout(()=>store.save({...b,remindedAt:Date.now()}).catch(()=>{}),300);return}
  const t=ev.target.closest("button,[data-act]");if(!t)return;const d=state.draft;
  if(t.dataset.tab){go(t.dataset.tab);return}
  if(t.dataset.mode){setMode(t.dataset.mode,true);autoArea();saveDraft();render();return}
  if(t.dataset.date){setDate(t.dataset.date);render();return}
  if(t.dataset.settime){d.time=t.dataset.settime;autoArea();saveDraft();refreshNew();document.querySelectorAll(".slot").forEach(s=>s.setAttribute("aria-pressed",String(s.dataset.settime===d.time)));return}
  if(t.dataset.g){if(setGuests(+t.dataset.g))return;const i=$("#d-guests");if(i)i.value=d.guests;autoArea();saveDraft();refreshNew();return}
  if(t.dataset.step){const k=t.dataset.step;if(k==="guests"){if(setGuests((+d.guests||0)+(+t.dataset.d1)))return}else{d.kids=Math.max(0,Math.min(d.guests,(+d.kids||0)+(+t.dataset.d1)))}const i=$("#d-"+k);if(i)i.value=d[k];autoArea();saveDraft();refreshNew();return}
  if(t.dataset.rstep){const k=t.dataset.rstep;d.req[k]=Math.max(0,(+d.req[k]||0)+(+t.dataset.d1));$("#r-"+k).value=d.req[k];saveDraft();refreshNew();return}
  if(t.dataset.allergy){const s=new Set(d.req.allergyTags||[]);s.has(t.dataset.allergy)?s.delete(t.dataset.allergy):s.add(t.dataset.allergy);d.req.allergyTags=[...s];d.req.allergyAsked=true;if(!d.req.allergyLevel)d.req.allergyLevel="allergy";saveDraft();render();return}
  if(t.dataset.alevel){d.req.allergyLevel=t.dataset.alevel;saveDraft();render();return}
  if(t.dataset.seat){const s=new Set(d.req.seatingTags||[]);s.has(t.dataset.seat)?s.delete(t.dataset.seat):s.add(t.dataset.seat);d.req.seatingTags=[...s];t.setAttribute("aria-pressed",String(s.has(t.dataset.seat)));saveDraft();refreshNew();return}
  if(t.dataset.area){if(t.getAttribute("aria-disabled")==="true"){toast("אין מקום שם בשעה הזו");return}d.area=t.dataset.area;d.areaManual=true;saveDraft();refreshNew();return}
  if(t.dataset.pkg){d.pkg=t.dataset.pkg;saveDraft();render();return}
  if(t.dataset.dstatus){d.status=t.dataset.dstatus;d.statusManual=true;saveDraft();render();return}
  if(t.dataset.cust){const c=customerIndex(d.id).get(t.dataset.cust);if(c){d.phone=c.phone||"";d.name=c.name||d.name;$("#d-phone").value=d.phone;$("#d-name").value=d.name;saveDraft();refreshNew()}return}
  if(t.dataset.day){state.calDay=t.dataset.day;if(t.classList.contains("out"))state.calMonth=t.dataset.day.slice(0,7);render();return}
  if(t.dataset.cal!==undefined){const k=+t.dataset.cal;if(!k){state.calMonth=today().slice(0,7);state.calDay=today()}else{const[y,m]=state.calMonth.split("-").map(Number);const x=new Date(y,m-1+k,1);state.calMonth=x.getFullYear()+"-"+pad(x.getMonth()+1)}render();return}
  if(t.dataset.lf){state.listFilter=t.dataset.lf;render();return}
  if(t.dataset.open){openBooking(t.dataset.open);return}
  if(t.dataset.status){const id=$("#modal").dataset.id,b=state.bookings.find(x=>x.id===id);if(!b)return;try{await store.save(applyStatus({...b},t.dataset.status,b.status));toast("סטטוס: "+t.dataset.status)}catch(e){}return}
  if(t.dataset.add==="closed"){const dt=($("#cd-date")||{}).value,nt=(($("#cd-note")||{}).value||"").trim();if(!dt){toast("בחרו תאריך");return}const c=readCfgForm();c.closedDates=[...(c.closedDates||[]).filter(x=>x.date!==dt),{date:dt,note:nt}];state.cfgEdit=c;render();return}
  if(t.dataset.add){const c=readCfgForm();if(t.dataset.add==="pkg")c.packages.push({id:"p"+uid(),name:"",pp:0,desc:""});else c.extras.push({id:"x"+uid(),name:"",unit:"flat",price:0});state.cfgEdit=c;render();return}
  if(t.dataset.rm){const c=readCfgForm();const[k,i]=t.dataset.rm.split("-");(k==="p"?c.packages:c.extras).splice(+i,1);state.cfgEdit=c;render();return}
  const act=t.dataset.act;if(!act)return;
  if(act==="close"){if(ev.target===t||t.classList.contains("x"))closeModal();return}
  if(act==="ask-del"){$("#delZone").innerHTML=`<div class="confirm"><span>למחוק את ההזמנה לצמיתות? (אפשר גם לסמן "בוטל")</span><button class="btn sm red" data-act="do-del">כן, מחק</button><button class="btn sm" data-act="cancel-del">חזור</button></div>`;return}
  if(act==="cancel-del"){openBooking($("#modal").dataset.id);return}
  if(act==="do-del"){const id=$("#modal").dataset.id;closeModal();try{await store.remove(id);toast("ההזמנה נמחקה")}catch(e){}return}
  if(act==="extend-hold"){const b=state.bookings.find(x=>x.id===$("#modal").dataset.id);if(!b)return;const base=Math.max(Date.now(),+b.holdUntil||0);try{await store.save({...b,holdUntil:base+24*3600e3});toast("השמירה הוארכה ב-24 שעות")}catch(e){}return}
  if(act==="edit"){const b=state.bookings.find(x=>x.id===$("#modal").dataset.id);if(!b)return;state.draft={...blankDraft(),...clone(b),mode:isEvent(b)?"event":"table",modeManual:true,statusManual:true,req:{...blankDraft().req,...(b.req||{})},areaManual:true};saveDraft();go("new");return}
  if(act==="copy-booking"){const b=state.bookings.find(x=>x.id===$("#modal").dataset.id);if(b)copyText(confirmText(b));return}
  if(act==="copy-draft"){copyText(confirmText(state.draft));return}
  if(act==="no-allergy"){Object.assign(d.req,{allergyTags:[],allergies:"",allergyWho:"",allergyLevel:"",allergyAsked:true});saveDraft();render();return}
  if(act==="copy-allergy"){const a=(customerIndex(d.id).get(digits(d.phone))||{}).al;if(!a)return;d.req.allergyTags=[...new Set([...(d.req.allergyTags||[]),...a.tags])];if(a.text&&!d.req.allergies)d.req.allergies=a.text;
    d.req.allergyLevel=a.level||"allergy";if(a.who&&!d.req.allergyWho)d.req.allergyWho=a.who;d.req.allergyAsked=true;saveDraft();render();toast("האלרגיה נוספה – לוודא עם הלקוח");return}
  if(act==="open-day"){d.openOverride=true;fixTime();autoArea();saveDraft();render();return}
  if(act==="print-brief"){document.body.classList.add("print-brief");setTimeout(()=>{try{window.print()}catch(e){}setTimeout(()=>document.body.classList.remove("print-brief"),800)},50);return}
  if(act==="ics-one"){const b=state.bookings.find(x=>x.id===$("#modal").dataset.id);if(b)openIcs(`MILA HOUSE – ${b.name}.ics`,icsFor([b]));return}
  if(act==="ics-upcoming"){const t0=today(),l=state.bookings.filter(b=>b.date>=t0&&b.date<=addDays(t0,30)&&isEvent(b)&&!isCancel(b));if(!l.length){toast("אין אירועים ב-30 הימים הקרובים");return}openIcs(`MILA HOUSE – אירועים ${shortDate(t0).replace("/","-")}.ics`,icsFor(l));return}
  if(act==="notif-enable"){try{if("Notification" in window&&Notification.permission==="default"){await Notification.requestPermission();if(Notification.permission==="granted")sysNotify("MILA HOUSE","התראות הופעלו במכשיר הזה ✓")}else if(!("Notification" in window))toast("המכשיר הזה לא תומך בהתראות. ההתראות יופיעו בתוך המערכת.");else toast(Notification.permission==="granted"?"ההתראות כבר פעילות":"ההתראות חסומות. אפשר לפתוח בהגדרות האייפד.")}catch(e){toast("לא ניתן להפעיל התראות כאן")}render();return}
  if(act==="nudge-x"){const n=t.closest(".nudge");if(n)n.remove();return}
  if(act==="copy-req"){const lb=(customerIndex(d.id).get(digits(d.phone))||{}).lastB;if(!lb||!lb.req)return;const r=lb.req;
    d.req.seatingTags=[...new Set([...(d.req.seatingTags||[]),...(r.seatingTags||[])])];if(r.seating&&!d.req.seating)d.req.seating=r.seating;if(r.notes&&!d.req.notes)d.req.notes=r.notes;
    for(const k of["veg","vegan","gf","baby"])if(!+d.req[k]&&+r[k])d.req[k]=+r[k];if(r.access)d.req.access=true;saveDraft();render();const s4=$("#step4");if(s4)s4.open=true;toast("הבקשות הועתקו");return}
  if(t.dataset.rmcd){const c=readCfgForm();c.closedDates=(c.closedDates||[]).filter(x=>x.date!==t.dataset.rmcd);state.cfgEdit=c;render();return}
  if(act==="new-blank"){state.draft=blankDraft();fixTime();autoArea();saveDraft();render();return}
  if(act==="new-on-day"){state.draft={...blankDraft(),date:state.calDay};autoArea();saveDraft();go("new");return}
  if(act==="save"){const err=canSave();if(err){toast(err);return}const c=calc(d);const rec={...clone(d),total:c.total};
    for(const k of["areaManual","modeManual","statusManual","createdBy"])delete rec[k];if(!evMode(d)){rec.pkg="est";rec.extras=[]}if(!rec.id)delete rec.id;
    const old=d.id&&state.bookings.find(b=>b.id===d.id);if(old){rec.createdAt=old.createdAt;if(old.holdUntil)rec.holdUntil=old.holdUntil}applyStatus(rec,rec.status,old?old.status:null);
    t.disabled=true;try{const id=await store.save(rec);toast(d.id?"ההזמנה עודכנה ✓":"נשמר ביומן ✓");state.calDay=rec.date;state.calMonth=rec.date.slice(0,7);state.draft=blankDraft();saveDraft();go("calendar");setTimeout(()=>openBooking(id),60)}catch(e){t.disabled=false}return}
  if(act==="cfg-discard"){state.cfgEdit=null;render();return}
  if(act==="suggest-cake"){d.req.cake=true;if(evMode(d)&&!d.extras.includes("x2")&&state.cfg.extras.some(x=>x.id==="x2"))d.extras=[...d.extras,"x2"];saveDraft();render();toast(evMode(d)?"סומן: עוגה (נוספה לתוספות)":"סומן: מביאים עוגה");return}
  if(act==="help"){openHelp();return}
  if(act==="export-list"){const lab={upcoming:"קרובות",events:"אירועים",pending:"ממתינות",past:"עבר",all:"הכול"}[state.listFilter]||"";
    t.disabled=true;await exportExcel(state.listRes||[],lab+(state.q.trim()?` – ${state.q.trim()}`:"")+` ${shortDate(today()).replace("/","-")}`);t.disabled=false;return}
  if(act==="export-month"){const[y,m]=state.calMonth.split("-").map(Number);t.disabled=true;await exportExcel(state.bookings.filter(b=>(b.date||"").startsWith(state.calMonth)),`${MONTHS[m-1]} ${y}`);t.disabled=false;return}
  if(act==="logout"){store.logout();return}
  if(act==="export-backup"){t.disabled=true;await exportBackup();t.disabled=false;return}
  if(act==="do-restore"){const r=state.pendingRestore;if(!r)return;const withCfg=r.cfg&&$("#rs-cfg")&&$("#rs-cfg").checked;t.disabled=true;
    try{await store.importAll(r.list,withCfg?r.cfg:null);state.pendingRestore=null;closeModal();toast(`שוחזרו ${r.list.length} הזמנות ✓`)}catch(e){t.disabled=false;toast("השחזור נכשל – נסו שוב")}return}
  if(act==="export-all"){t.disabled=true;await exportExcel(state.bookings,`גיבוי מלא ${today()}`);t.disabled=false;return}
});
function openHelp(){lsSet("lucia.guideSeen",true);
  $("#modal").dataset.id="";
  $("#modal").innerHTML=`<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-modal="true" aria-label="מדריך שימוש">
   <div class="row"><h2>איך עובדים עם המערכת</h2><button class="x" data-act="close" aria-label="סגור">×</button></div>
   <div class="help-step"><i>1</i><div><b>לקוח מתקשר</b><span>"הזמנה חדשה", ואז לפי סדר השיחה: תאריך, כמה סועדים, שעה. השעות הירוקות פנויות, והפס למעלה אומר מיד אם יש מקום.</span></div></div>
   <div class="help-step"><i>2</i><div><b>טלפון ושם</b><span>מקלידים טלפון. אם הלקוח כבר הזמין בעבר, השם מתמלא לבד ורואים את הבקשות הקבועות שלו.</span></div></div>
   <div class="help-step"><i>3</i><div><b>אירוע</b><span>מ-${state.cfg.eventFrom} סועדים (או בלחיצה על "אירוע / קבוצה") נפתחות חבילות, תוספות ומקדמה. בצד יש משפט מוכן להקריא ללקוח עם המחיר.</span></div></div>
   <div class="help-step"><i>4</i><div><b>שמור עד מקדמה</b><span>תופס את התאריך ל-${state.cfg.holdHours} שעות. אם המקדמה לא שולמה עד אז, ההזמנה מופיעה במסך הבית ב"לטיפול".</span></div></div>
   <div class="help-step"><i>5</i><div><b>שמירה ואישור</b><span>"שמור ביומן", ואז "אישור בוואטסאפ" שולח ללקוח את כל הפרטים.</span></div></div>
   <div class="help-step"><i>6</i><div><b>יומן, חיפוש, אקסל</b><span>ביומן רואים כל יום, בחיפוש מוצאים הזמנה לפי שם או טלפון, ובהגדרות מורידים גיבוי ומשנים מחירים וחבילות.</span></div></div>
   <button class="btn primary lg" data-act="close">הבנתי</button>
  </div></div>`;
}
function autoArea(){const d=state.draft;const av=availability(d);const cur=av.find(a=>a.id===d.area);
  if(cur&&cur.fits)return;const fit=av.filter(a=>a.fits);if(!fit.length){if(!d.areaManual)d.area=null;return}d.area=fit[0].id;d.areaManual=false}
document.addEventListener("input",ev=>{
  const el=ev.target,d=state.draft;
  if(el.id==="q"){state.q=el.value;const pos=el.selectionStart;render();const q=$("#q");q.focus();q.setSelectionRange(pos,pos);return}
  if(el.dataset.d){const k=el.dataset.d;let v=el.type==="checkbox"?el.checked:el.value;if(["guests","kids","dur","discount","depositPaid"].includes(k))v=+v||0;
    if(k==="date"){if(v)setDate(v);render();return}
    if(k==="guests"){if(v>0&&setGuests(v))return;d.guests=v}else d[k]=v;
    if(["time","dur","guests","buyout"].includes(k))autoArea();saveDraft();if(k==="occasion"||k==="buyout")render();else refreshNew();return}
  if(el.dataset.r){const k=el.dataset.r;const before=allergyList(d.req).length>0;d.req[k]=el.type==="checkbox"?el.checked:(["veg","vegan","gf","baby"].includes(k)?+el.value||0:el.value);
    if(k==="allergies"){if(el.value.trim())d.req.allergyAsked=true;if(!d.req.allergyLevel)d.req.allergyLevel="allergy"}saveDraft();if(k==="allergies"&&before!==(allergyList(d.req).length>0))render();else refreshNew();return}
  if(el.dataset.extra){const s=new Set(d.extras);el.checked?s.add(el.dataset.extra):s.delete(el.dataset.extra);d.extras=[...s];saveDraft();refreshNew();return}
});
document.addEventListener("focusout",ev=>{
  const el=ev.target,d=state.draft;if(!el.dataset||!el.dataset.d)return;const k=el.dataset.d;
  const clamp={guests:[1,300],kids:[0,d.guests],discount:[0,50],depositPaid:[0,999999]}[k];if(!clamp)return;
  const v=Math.max(clamp[0],Math.min(clamp[1],+el.value||clamp[0]));if(v!==d[k]||el.value===""){d[k]=v;el.value=v;saveDraft();refreshNew()}
});
document.addEventListener("submit",async ev=>{ev.preventDefault();const f=ev.target;if(f.id!=="cfgForm")return;const c=readCfgForm();
  c.packages=c.packages.filter(p=>p.name);c.extras=c.extras.filter(x=>x.name);
  try{await store.saveCfg(c);state.cfg=mergeCfg(c);state.cfgEdit=null;toast("ההגדרות נשמרו לכל הצוות ✓");render()}catch(e){}});
document.addEventListener("change",ev=>{if(ev.target.id==="restoreFile"){const f=ev.target.files&&ev.target.files[0];ev.target.value="";if(f)askRestore(f)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#modal").innerHTML)closeModal()});
/* entry splash */
(function splash(){const s=$("#splash");if(!s)return;const l=$(".logo img");if(l)s.querySelector("img").src=l.src;
  setTimeout(()=>s.classList.add("out"),REDUCED?150:1150);setTimeout(()=>s.remove(),REDUCED?500:1900)})();

const h=(location.hash||"").slice(1);if(VIEWS[h])state.tab=h;
document.getElementById("loginForm").addEventListener("submit",ev=>{ev.preventDefault();ev.stopPropagation();
  if($("#lg-btn").dataset.mode==="retry"){location.reload();return}
  const em=$("#lg-email").value,pw=$("#lg-pass").value;if(!em.trim()||!pw){$("#lg-err").textContent="הקלידו אימייל וסיסמה";return}store.login(em,pw)});
render();store.init();
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
