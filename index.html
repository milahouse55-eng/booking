<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MILA HOUSE</title>
<meta name="theme-color" content="#5A4F4D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MILA HOUSE">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@400;500;600;700&display=swap">
<style>html,body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: staff console — sticky header, tab bar (bottom on phone / top on desktop); booking screen = form column + sticky price summary */
:root{
  --bg:#F7F4F0; --surface:#FFFFFF; --surface-2:#EFEAE4; --line:#DFD7CF;
  --fg:#2A2422; --muted:#6F6560;
  --basil:#5A4F4D; --basil-ink:#F9F3F0; --pomodoro:#9C5B3E; --pomodoro-ink:#FFFFFF; --parm:#C2A07A;
  --head:#5A4F4D; --head-ink:#F9F3F0;
  --ok:#4E7558; --ok-bg:#E6EFE6; --warn:#9A6614; --warn-bg:#F7EBD6; --bad:#A8423A; --bad-bg:#F6E2DF;
  --event:#7B5468; --table:#5A4F4D;
  --shadow:0 10px 30px rgba(42,36,34,.13);
  --display:"Frank Ruhl Libre","David Libre",Georgia,serif;
  --body:"Heebo","Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171413; --surface:#201C1B; --surface-2:#2A2524; --line:#3A3331; --fg:#F3EDE8; --muted:#A99A92;
  --basil:#CDBFB4; --basil-ink:#1C1817; --pomodoro:#D79A7C; --pomodoro-ink:#1C1817; --parm:#D7B49A;
  --head:#2E2826; --head-ink:#F3EDE8;
  --ok:#7FB08B; --ok-bg:#1F2E23; --warn:#E0A955; --warn-bg:#362A17; --bad:#E88A80; --bad-bg:#3A221F;
  --event:#C49AB2; --table:#B7A79B; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171413; --surface:#201C1B; --surface-2:#2A2524; --line:#3A3331; --fg:#F3EDE8; --muted:#A99A92;
  --basil:#CDBFB4; --basil-ink:#1C1817; --pomodoro:#D79A7C; --pomodoro-ink:#1C1817; --parm:#D7B49A;
  --head:#2E2826; --head-ink:#F3EDE8;
  --ok:#7FB08B; --ok-bg:#1F2E23; --warn:#E0A955; --warn-bg:#362A17; --bad:#E88A80; --bad-bg:#3A221F;
  --event:#C49AB2; --table:#B7A79B; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;direction:rtl;padding-bottom:90px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--head)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--parm);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--head);color:var(--head-ink)}
header.top .wrap{display:flex;align-items:center;gap:14px;padding-block:9px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo{gap:14px}
.logo img{height:46px;width:auto;display:block;flex:none}
.logo .sub{font-size:12px;letter-spacing:.4px;opacity:.82;padding-inline-start:14px;border-inline-start:1px solid currentColor;line-height:1.2;white-space:nowrap}
@media (max-width:420px){.logo .sub{display:none}}
.tricolore{height:2px;background:linear-gradient(90deg,transparent,var(--parm) 20%,var(--parm) 80%,transparent);opacity:.9}.tricolore i{display:none}
.spacer{flex:1}
.me{font-size:12px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);white-space:nowrap;max-width:44vw;overflow:hidden;text-overflow:ellipsis}

nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav.tabs button{background:none;border:0;border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--basil);font-weight:700;background:var(--surface-2)}
nav.tabs button.cta{color:var(--pomodoro);font-weight:700}
@media (min-width:900px){
  body{padding-bottom:24px}
  nav.tabs{position:static;border:0;background:transparent;display:flex;gap:6px;padding:0;margin-top:16px}
  nav.tabs button{flex-direction:row;gap:8px;font-size:15px;padding:9px 16px;background:var(--surface);border:1px solid var(--line)}
  nav.tabs button svg{width:18px;height:18px}
  nav.tabs button[aria-current="page"]{background:var(--basil);color:var(--basil-ink);border-color:var(--basil)}
  nav.tabs button.cta:not([aria-current="page"]){border-color:var(--pomodoro)}
}
main{padding-block:16px 24px}
.view{display:grid;gap:16px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:clamp(24px,4vw,34px);font-weight:700;letter-spacing:.2px}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
.lede{color:var(--muted);margin:2px 0 0;max-width:66ch}
.eyebrow{font-size:12px;letter-spacing:1.2px;color:var(--pomodoro);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;align-content:start;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;gap:16px}
@media (min-width:900px){.grid2{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.btn:hover{border-color:var(--basil)}
.btn.primary{background:var(--basil);border-color:var(--basil);color:var(--basil-ink)}
.btn.red{background:var(--pomodoro);border-color:var(--pomodoro);color:var(--pomodoro-ink)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.lg{padding:12px 18px;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.note{font-size:12px;color:var(--muted)}
.btn.xl{border-color:var(--ok);color:var(--ok)}
.btn.xl:hover{background:var(--ok-bg)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:720px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--muted)}

/* forms */
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.fgrid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.fgrid .full{grid-column:1/-1}
@media (max-width:560px){.fgrid,.fgrid.three{grid-template-columns:1fr 1fr}.fgrid .wide{grid-column:1/-1}}
label.f,.f{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;color:var(--fg);font-weight:400;font-size:15px;min-width:0}
textarea.inp{min-height:64px;resize:vertical}
.stepper{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.stepper button{border:0;background:var(--surface-2);width:40px;font-size:20px;font-weight:700}
.stepper input{border:0;background:transparent;text-align:center;width:100%;min-width:0;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;padding:6px 0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 11px;line-height:1.25;text-align:center}
.chips button small{display:block;font-size:11px;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips button[aria-pressed="true"] small{color:inherit;opacity:.75}
.chipgrid{display:flex;flex-wrap:wrap;gap:6px}
.chipgrid button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;font-size:13px;line-height:1.2}
.chipgrid button[aria-pressed="true"]{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.chipgrid.neutral button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chipgrid button svg{vertical-align:-2px;margin-inline-start:3px}
/* quick-jump step nav: keeps every section one tap away so nothing gets lost while scrolling */
.stepnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 48px);z-index:20;display:flex;gap:6px;overflow-x:auto;padding:8px 0;margin:-4px 0 0;background:var(--bg)}
.stepnav a{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px 6px 9px;font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;scroll-snap-align:start}
.stepnav a:hover,.stepnav a.active{color:var(--fg);border-color:var(--basil)}
.stepnav a i{width:19px;height:19px;border-radius:50%;background:var(--surface-2);color:var(--fg);display:grid;place-items:center;font-size:11px;font-weight:700;font-style:normal;flex:none}
.stepnav a.done i{background:var(--basil);color:var(--basil-ink)}
.suggest{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface-2);border:1px dashed var(--basil);border-radius:10px;padding:9px 12px;font-size:13px}
.suggest svg{flex:none;color:var(--basil)}
.help-step{display:flex;gap:12px;align-items:flex-start}
.help-step i{width:30px;height:30px;border-radius:50%;background:var(--basil);color:var(--basil-ink);display:grid;place-items:center;font-weight:700;font-style:normal;flex:none;font-family:var(--display)}
.help-step div b{display:block;margin-bottom:2px}
.help-step div span{color:var(--muted);font-size:13px}
.helpbtn{border:0;background:rgba(255,255,255,.18);color:inherit;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;font-size:14px}
#step1,#step2,#step3,#step4{scroll-margin-top:132px}
.seg{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:right;display:grid;gap:2px;min-width:0}
.opt b{font-size:15px}
.opt span{font-size:12px;color:var(--muted)}
.opt .p{font-weight:700;color:var(--basil);font-variant-numeric:tabular-nums}
.opt[aria-pressed="true"]{border-color:var(--basil);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--basil)}
.checks{display:grid;gap:6px}
.check{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.check input[type=checkbox]{width:18px;height:18px;accent-color:var(--basil);flex:none}
.check .grow{flex:1;min-width:0}
.check small{color:var(--muted);display:block;font-size:12px}
.check .p{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.mini{width:64px;flex:none;text-align:center}

/* availability */
.section-h{display:flex;align-items:center;gap:10px}
.section-h .n{width:26px;height:26px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.areas{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.area{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);text-align:right;display:grid;gap:6px;min-width:0}
.area .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.area b{font-size:15px;display:inline-flex;align-items:center;gap:7px}
.area b svg{flex:none;opacity:.8}
.area .bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex}
.area .bar i{display:block;height:100%}
.area .bar .used{background:var(--muted);opacity:.55}
.area .bar .new{background:var(--basil)}
.area.full .bar .new{background:var(--bad)}
.area .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.area[aria-pressed="true"]{border-color:var(--basil);box-shadow:inset 0 0 0 1.5px var(--basil);background:var(--surface-2)}
.area.full{opacity:.75}
.badge{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.bad{background:var(--bad-bg);color:var(--bad)}
.verdict{border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-weight:600}
.verdict.ok{background:var(--ok-bg);color:var(--ok)}.verdict.bad{background:var(--bad-bg);color:var(--bad)}.verdict.warn{background:var(--warn-bg);color:var(--warn)}
.verdict svg{flex:none}

/* summary paper */
.paper{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
.paper .ph{background:var(--fg);color:var(--bg);padding:12px 16px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.paper .ph h3{color:inherit}
.paper .ph small{opacity:.75}
.paper .pb{padding:12px 16px 16px;display:grid;gap:10px}
.lines{width:100%;border-collapse:collapse;font-size:14px}
.lines td{padding:6px 0;border-bottom:1px dashed var(--line);vertical-align:top}
.lines td:last-child{text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums;padding-inline-start:10px}
.lines td small{display:block;color:var(--muted);font-size:12px}
.lines tr.sum td{border-bottom:0;color:var(--muted);padding:3px 0}
.lines tr.total td{border-top:2px solid var(--fg);border-bottom:0;font-family:var(--display);font-weight:700;font-size:24px;padding-top:10px}
.pp{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);background:var(--surface-2);padding:7px 10px;border-radius:8px}
.pp b{color:var(--fg);font-variant-numeric:tabular-nums}
.reqchips{display:flex;gap:5px;flex-wrap:wrap}
.rq{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--warn-bg);color:var(--warn);font-weight:600;white-space:nowrap}
.rq.al{background:var(--bad-bg);color:var(--bad)}
@media (max-width:899px){.paper{position:static}}
.savebar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:25;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.savebar .in{background:var(--fg);color:var(--bg);border-radius:14px;padding:9px 10px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
.savebar b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.savebar small{display:block;font-size:11px;opacity:.75}
body.has-save{padding-bottom:160px}
@media (min-width:900px){.savebar{display:none}body.has-save{padding-bottom:24px}}

/* dish picker */
.dishes{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.dish{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:6px;background:var(--surface)}
.dish .pic{width:62px;height:48px;border-radius:8px;overflow:hidden}
.dish .pic svg{width:100%;height:100%;display:block}
.dish b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dish span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.qty button{background:var(--surface-2);border:0;width:28px;height:28px;font-size:17px;line-height:1}
.qty span{min-width:24px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.addbtn{border:1px solid var(--basil);color:var(--basil);background:transparent;border-radius:9px;width:30px;height:30px;font-size:18px;font-weight:700}
details.fold{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.fold>summary{cursor:pointer;padding:10px 12px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"＋";color:var(--muted)}
details.fold[open]>summary::after{content:"－"}
details.fold>div{padding:0 12px 12px;display:grid;gap:10px}

/* booking rows */
.list{display:grid;gap:8px}
.bk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:right;width:100%}
.bk:hover{border-color:var(--basil)}
.bk .t{font-variant-numeric:tabular-nums;font-weight:700;min-width:54px;text-align:center;border-inline-end:1px solid var(--line);padding-inline-end:12px}
.bk .t small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.bk .main{min-width:0;display:grid;gap:3px}
.bk .main b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk .main .sub{font-size:13px;color:var(--muted)}
.bk .side{display:grid;gap:4px;justify-items:end}
.bk .val{font-weight:700;font-variant-numeric:tabular-nums}
.bk.cancel{opacity:.55}
.bk.cancel .main b{text-decoration:line-through}
.st{font-size:12px;padding:2px 8px;border-radius:6px;white-space:nowrap;font-weight:600}
.st.s0{background:var(--warn-bg);color:var(--warn)}.st.s1{background:var(--ok-bg);color:var(--ok)}.st.s2{background:var(--ok);color:var(--surface)}.st.s3{background:var(--surface-2);color:var(--muted)}.st.s4{background:var(--bad-bg);color:var(--bad)}
.kind{font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;border:1px solid currentColor}
.kind.ev{color:var(--event)}.kind.tb{color:var(--table)}
.empty{color:var(--muted);text-align:center;padding:20px;border:1px dashed var(--line);border-radius:12px}

/* calendar */
.calhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.calhead h2{min-width:140px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:12px;color:var(--muted);text-align:center;font-weight:600;padding:2px 0}
.day{min-height:92px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:3px;text-align:right;overflow:hidden;min-width:0}
.day.out{opacity:.38}
.day.today .dn{background:var(--pomodoro);color:var(--pomodoro-ink);border-radius:99px;padding:0 7px}
.day[aria-pressed="true"]{border-color:var(--basil);box-shadow:inset 0 0 0 1.5px var(--basil)}
.dn{font-weight:700;font-size:13px;align-self:flex-start;font-variant-numeric:tabular-nums}
.day .g{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.day .m{font-size:12px;color:var(--basil);font-weight:700;font-variant-numeric:tabular-nums}
.day .ev{font-size:11px;padding:1px 5px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--event);color:var(--surface)}
.day .load{margin-top:auto;height:4px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.day .load i{display:block;height:100%;background:var(--basil)}
.day .load i.hi{background:var(--pomodoro)}
.flag{width:7px;height:7px;border-radius:50%;background:var(--bad);display:inline-block;margin-inline-start:4px;vertical-align:middle}
@media (max-width:640px){.day{min-height:66px;padding:4px}.day .ev,.day .m{display:none}.day .g{font-size:11px}}

/* timeline */
.tl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tl{min-width:720px;display:grid;grid-template-columns:110px 1fr}
.tl .lab{padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600;display:flex;flex-direction:column;justify-content:center;gap:2px;background:var(--surface-2)}
.tl .lab small{font-weight:400;color:var(--muted)}
.tl .labname{display:flex;align-items:center;gap:6px}
.tl .labname svg{flex:none;opacity:.75}
.tl .lane{position:relative;border-bottom:1px solid var(--line);min-height:52px;background-image:linear-gradient(to left,var(--line) 1px,transparent 1px);background-size:calc(100%/13) 100%}
.tl .hours{position:relative;height:24px;border-bottom:1px solid var(--line)}
.tl .hours span{position:absolute;top:4px;font-size:11px;color:var(--muted);transform:translateX(50%);font-variant-numeric:tabular-nums}
.blk{position:absolute;top:6px;bottom:6px;border-radius:7px;padding:2px 6px;font-size:11px;line-height:1.3;color:var(--surface);background:var(--table);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border:0;text-align:right}
.blk.ev{background:var(--event)}
.blk b{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis}
.blk.stack1{top:28px}

/* prep */
.prep{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.prep ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:14px}
.prep li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:3px}
.prep li b{font-variant-numeric:tabular-nums}

/* modal / toast */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(10,14,9,.55);display:flex;align-items:flex-end;justify-content:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;box-shadow:var(--shadow)}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px}}
.x{margin-inline-start:auto;border:0;background:var(--surface-2);width:34px;height:34px;border-radius:99px;font-size:18px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500;min-width:0}
.confirm{background:var(--surface-2);border-radius:10px;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;z-index:80;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.sync{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.sync.on i{background:var(--ok)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.settings-row{display:grid;grid-template-columns:minmax(0,1.4fr) 90px auto;gap:8px;align-items:center}
.gate{position:fixed;inset:0;z-index:100;background:var(--head);color:var(--head-ink);display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top,0px)) 20px max(24px,env(safe-area-inset-bottom,0px));overflow:auto}
.gate-card{width:min(380px,100%);display:grid;gap:14px}
.gate-card img{height:84px;width:auto;justify-self:center;margin-bottom:6px}
.gate-card h1{text-align:center;font-weight:500;font-size:24px;color:inherit}
.gate-card .f{color:inherit;opacity:.92}
.gate-card .inp{background:#FBF8F5;color:#2A2422;border-color:transparent;font-size:16px;padding:12px 13px}
.gate-card .btn{justify-content:center;width:100%}
.gate-err{color:#F6C2B4;min-height:1.3em;margin:0;font-size:14px;text-align:center}
.gate-note{font-size:13px;opacity:.75;text-align:center;margin:0}
.gate-msg{text-align:center;line-height:1.6;margin:0}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
<script src="firebase-config.js"></script>

/* ================= FIREBASE — keys live in firebase-config.js, so updating this file never touches them ================= */
const FIREBASE_CONFIG=(window.MILA_FIREBASE_CONFIG&&typeof window.MILA_FIREBASE_CONFIG==="object")?window.MILA_FIREBASE_CONFIG:{};
const FB_BASE="https://www.gstatic.com/firebasejs/10.12.2/";
const FB_READY=!!(FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.projectId);

const AUTH_ERR={"auth/invalid-credential":"האימייל או הסיסמה לא נכונים","auth/wrong-password":"האימייל או הסיסמה לא נכונים","auth/user-not-found":"האימייל או הסיסמה לא נכונים","auth/invalid-email":"כתובת האימייל לא תקינה","auth/missing-password":"הקלידו סיסמה","auth/too-many-requests":"יותר מדי ניסיונות. חכו כמה דקות ונסו שוב","auth/network-request-failed":"אין חיבור לאינטרנט","auth/user-disabled":"המשתמש הזה הושבת"};
function gate(mode,msg){const g=$("#gate");if(mode==="hide"){g.hidden=true;return}
  if(!$("#gateLogo").src){const l=$(".logo img");if(l)$("#gateLogo").src=l.src}
  g.hidden=false;const login=mode==="login";$("#gateFields").hidden=!login;$("#gateNote").hidden=!login;
  $("#lg-btn").textContent=login?"כניסה":"נסו שוב";$("#lg-btn").dataset.mode=mode;$("#lg-btn").disabled=false;$("#lg-err").textContent=msg||"";
  if(login)setTimeout(()=>{const e=$("#lg-email");if(e&&!e.value)e.focus()},50)}

const store={db:null,fb:null,auth:null,user:null,unsub:[],
  async init(){
    if(!FB_READY){this.local("מצב הדגמה – עדיין לא חובר למאגר (ראו מדריך ההקמה)");return}
    let A,U,F;
    try{[A,U,F]=await Promise.all([import(FB_BASE+"firebase-app.js"),import(FB_BASE+"firebase-auth.js"),import(FB_BASE+"firebase-firestore.js")])}
    catch(e){gate("retry","אין חיבור לאינטרנט, אז אי אפשר לטעון את המערכת. בדקו את ה-Wi-Fi ונסו שוב.");return}
    this.fb={...U,...F};
    const app=A.initializeApp(FIREBASE_CONFIG);this.auth=U.getAuth(app);
    try{this.db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}catch(e){this.db=F.getFirestore(app)}
    U.onAuthStateChanged(this.auth,u=>{this.user=u||null;
      if(u){gate("hide");this.listen();if(state.tab==="settings")render();if(!lsGet("lucia.guideSeen",false))setTimeout(openHelp,400)}
      else{this.stop();state.bookings=[];state.cfg=clone(DEFAULT_CFG);onData();gate("login",this.deniedMsg||"");this.deniedMsg=null}});
  },
  async login(email,pass){const btn=$("#lg-btn");btn.disabled=true;$("#lg-err").textContent="";
    try{await this.fb.signInWithEmailAndPassword(this.auth,email.trim(),pass)}catch(e){$("#lg-err").textContent=AUTH_ERR[e&&e.code]||"הכניסה נכשלה. נסו שוב";btn.disabled=false}},
  async logout(){try{await this.fb.signOut(this.auth)}catch(e){toast("ההתנתקות נכשלה")}},
  listen(){const F=this.fb;this.stop();setSync(false,"מתחבר…");
    const timer=setTimeout(()=>setSync(false,"היומן לא נטען עדיין – בדקו חיבור"),10000);
    const denied=e=>{if(!(e&&e.code==="permission-denied"))return false;if(this.deniedMsg||!this.user)return true;this.stop();
      const em=this.user&&this.user.email;this.deniedMsg=`למשתמש ${em||""} אין הרשאה למערכת. בדקו שזה האימייל של העסק (שלב 5 במדריך).`;F.signOut(this.auth);return true};
    this.unsub.push(F.onSnapshot(F.collection(this.db,"bookings"),{includeMetadataChanges:true},snap=>{clearTimeout(timer);
      const off=snap.metadata.fromCache;setSync(!off,off?"אין אינטרנט – עובדים מהעותק במכשיר, יסונכרן כשיחזור":"מסונכרן עם הצוות");
      state.bookings=snap.docs.map(d=>({id:d.id,...d.data()}));onData()},e=>{clearTimeout(timer);if(!denied(e))setSync(false,"שגיאה בטעינת היומן – רעננו את הדף")}));
    this.unsub.push(F.onSnapshot(F.doc(this.db,"config","main"),s=>{state.cfg=s.exists()?{...clone(DEFAULT_CFG),...s.data()}:clone(DEFAULT_CFG);onData()},e=>{denied(e)}));
  },
  stop(){this.unsub.forEach(f=>{try{f()}catch(e){}});this.unsub=[]},
  local(msg){this.db=null;state.bookings=lsGet("lucia.bookings",null)||DEMO();state.cfg={...clone(DEFAULT_CFG),...(lsGet("lucia.cfg",{})||{})};setSync(false,msg);onData()},
  // Writes go to the device copy at once and sync in the background — the app never waits for the internet.
  writeErr(e){toast(e&&e.code==="permission-denied"?"אין הרשאה לשמור – פנו למנהלת":"השמירה לשרת נכשלה – נסו שוב")},
  async save(b){const id=b.id||uid();const body=clone(b);delete body.id;body.updatedAt=Date.now();if(!body.createdAt)body.createdAt=Date.now();
    if(this.db){const F=this.fb;F.setDoc(F.doc(this.db,"bookings",id),body).catch(e=>this.writeErr(e));return id}
    const i=state.bookings.findIndex(x=>x.id===id);const rec={id,...body};i>=0?state.bookings[i]=rec:state.bookings.push(rec);lsSet("lucia.bookings",state.bookings);onData();return id},
  async remove(id){if(this.db){const F=this.fb;F.deleteDoc(F.doc(this.db,"bookings",id)).catch(e=>this.writeErr(e));return}
    state.bookings=state.bookings.filter(x=>x.id!==id);lsSet("lucia.bookings",state.bookings);onData()},
  async saveCfg(c){if(this.db){const F=this.fb;F.setDoc(F.doc(this.db,"config","main"),c).catch(e=>this.writeErr(e));state.cfg={...clone(DEFAULT_CFG),...c};return}
    state.cfg={...clone(DEFAULT_CFG),...c};lsSet("lucia.cfg",c);onData()},
  async importAll(list,cfg){
    if(this.db){const F=this.fb;for(let i=0;i<list.length;i+=400){const bt=F.writeBatch(this.db);
        list.slice(i,i+400).forEach(b=>{const body=clone(b);delete body.id;bt.set(F.doc(this.db,"bookings",b.id),body)});bt.commit().catch(e=>this.writeErr(e))}
      if(cfg)F.setDoc(F.doc(this.db,"config","main"),cfg).catch(e=>this.writeErr(e));return}
    const m=new Map(state.bookings.map(b=>[b.id,b]));list.forEach(b=>m.set(b.id,clone(b)));state.bookings=[...m.values()];lsSet("lucia.bookings",state.bookings);
    if(cfg){state.cfg={...clone(DEFAULT_CFG),...cfg};lsSet("lucia.cfg",cfg)}onData()}
};

// peak seated guests in an area during [start,end) — exclusive areas count any overlap as full
function areaUse(date,time,dur,areaId,excludeId){
  const a=cfgArea(areaId);if(!a)return{used:0,list:[]};const s=mins(time),e=s+(+dur||state.cfg.dur);
  const list=state.bookings.filter(b=>b.date===date&&b.area===areaId&&b.id!==excludeId&&!isCancel(b)).filter(b=>{const bs=mins(b.time),be=bs+(+b.dur||state.cfg.dur);return bs<e&&be>s});
  if(a.exclusive)return{used:list.length?a.cap:0,list};
  const pts=[s,...list.map(b=>mins(b.time)).filter(p=>p>s&&p<e)];let peak=0;
  for(const p of pts){const sum=list.filter(b=>{const bs=mins(b.time),be=bs+(+b.dur||state.cfg.dur);return bs<=p&&be>p}).reduce((t,b)=>t+(+b.guests||0),0);peak=Math.max(peak,sum)}
  return{used:peak,list};
}
function availability(d){
  return state.cfg.areas.map(a=>{const u=areaUse(d.date,d.time,d.dur,a.id,d.id);const free=Math.max(0,a.cap-u.used);const fits=(+d.guests||0)<=free&&(+d.guests||0)>0;
    const after=u.used+(+d.guests||0);const level=!fits?"bad":after/a.cap>.85?"warn":"ok";return{...a,used:u.used,free,fits,level,list:u.list}});
}
function suggestTimes(d){
  const base=mins(d.time),out=[];
  for(const off of[30,-30,60,-60,90,-90,120,-120,150,-150]){const t=base+off;if(t<12*60||t>22*60+30)continue;const tt=hhmm(t);
    const av=availability({...d,time:tt}).filter(a=>a.fits);if(av.length)out.push({time:tt,areas:av.map(a=>a.name)});if(out.length>=4)break}
  return out.sort((a,b)=>mins(a.time)-mins(b.time));
}
function calc(b){
  const c=state.cfg,g=Math.max(0,+b.guests||0),kids=Math.min(g,Math.max(0,+b.kids||0)),adults=g-kids,lines=[];
  const pkg=c.packages.find(p=>p.id===b.pkg);
  if(b.pkg==="est")lines.push({label:"הערכת הוצאה לסועד",sub:`${adults} × ${nis(c.estSpend)}`,amt:adults*c.estSpend});
  else if(pkg)lines.push({label:`חבילת ${pkg.name}`,sub:`${adults} × ${nis(pkg.pp)}`,amt:adults*pkg.pp});
  if(kids)lines.push({label:"תפריט ילדים",sub:`${kids} × ${nis(c.kidsPrice)}`,amt:kids*c.kidsPrice});
  for(const id of b.extras||[]){const x=c.extras.find(e=>e.id===id);if(x)lines.push({label:x.name,sub:x.unit==="pp"?`${adults} × ${nis(x.price)}`:"",amt:x.unit==="pp"?x.price*adults:x.price})}
  for(const[id,n]of Object.entries(b.dishes||{})){const m=MENU_BY_ID[id];if(m&&n>0)lines.push({label:m.name,sub:`${n} × ${nis(m.price)}`,amt:n*m.price})}
  const sub=lines.reduce((a,l)=>a+l.amt,0),disc=Math.round(sub*Math.min(50,Math.max(0,+b.discount||0))/100);
  const service=b.service?Math.round((sub-disc)*c.service/100):0,total=sub-disc+service;
  const deposit=Math.round(total*c.depositPct/100),paid=+b.depositPaid||0;
  return{lines,sub,disc,service,total,pp:g?total/g:0,deposit,paid,balance:total-paid};
}
const isEvent=b=>(+b.guests>=state.cfg.eventFrom)||(b.pkg&&b.pkg!=="est"&&b.pkg!=="alc");
const allergyList=r=>[...((r&&r.allergyTags)||[]),...((r&&r.allergies&&r.allergies.trim())?[r.allergies.trim()]:[])];
const seatingList=r=>[...((r&&r.seatingTags)||[]),...((r&&r.seating&&r.seating.trim())?[r.seating.trim()]:[])];
function reqChips(b){const r=b.req||{},o=[];const al=allergyList(r);
  if(al.length)o.push(`<span class="rq al">⚠ ${esc(al.join(", "))}</span>`);
  if(+r.veg)o.push(`<span class="rq">${r.veg} צמחוני</span>`);if(+r.vegan)o.push(`<span class="rq">${r.vegan} טבעוני</span>`);if(+r.gf)o.push(`<span class="rq">${r.gf} ללא גלוטן</span>`);

  seatingList(r).forEach(s=>o.push(`<span class="rq">${esc(s)}</span>`));
  return o.join("")}
const hasReq=b=>{const r=b.req||{};return !!(allergyList(r).length||+r.veg||+r.vegan||+r.gf||+r.baby||r.cake||r.access||seatingList(r).length||r.notes)};
function dayStats(date){const l=state.bookings.filter(b=>b.date===date&&!isCancel(b));

function timeline(date){
  const START=11*60,SPAN=13*60;const l=state.bookings.filter(b=>b.date===date&&!isCancel(b));
  const hours=Array.from({length:14},(v,i)=>`<span style="right:${(i/13*100).toFixed(2)}%">${pad(11+i>23?(11+i-24):11+i)}:00</span>`).join("");
  const lanes=state.cfg.areas.map(a=>{const bl=l.filter(b=>b.area===a.id).sort((x,y)=>mins(x.time)-mins(y.time));const ends=[];
    const blocks=bl.map(b=>{const s=mins(b.time),d=+b.dur||state.cfg.dur;let row=ends.findIndex(e=>e<=s);if(row<0){row=ends.length;ends.push(0)}ends[row]=s+d;
      const r=Math.max(0,(s-START)/SPAN*100),w=Math.min(100-r,d/SPAN*100);
      return`<button class="blk${isEvent(b)?" ev":""}${row%2?" stack1":""}" data-open="${esc(b.id)}" style="right:${r.toFixed(2)}%;width:${w.toFixed(2)}%;${ends.length>1?"bottom:auto;height:20px;"+(row%2?"":"top:5px;"):""}" title="${esc(b.name)}"><b>${b.guests} · ${esc(b.name)}</b>${ends.length>1?"":esc(b.time)}</button>`}).join("");
    return`<div class="lab"><span class="labname">${areaIcon(a.id)}${esc(a.name)}</span><small>${a.cap} מקומות${a.exclusive?" · סגור":""}</small></div><div class="lane" style="${ends.length>1?"min-height:58px":""}">${blocks}</div>`}).join("");
  return`<div class="tl-wrap"><div class="tl"><div class="lab" style="background:transparent"></div><div class="hours">${hours}</div>${lanes}</div></div>`;
}
function prepSheet(list){
  const c=state.cfg,pk={},dishes={},diet={veg:0,vegan:0,gf:0,baby:0},al=[],cakes=[],notes=[];
  for(const b of list){const p=c.packages.find(x=>x.id===b.pkg);if(p){pk[p.name]=(pk[p.name]||0)+(+b.guests-(+b.kids||0))}if(+b.kids)pk["תפריט ילדים"]=(pk["תפריט ילדים"]||0)+(+b.kids);
    for(const[id,n]of Object.entries(b.dishes||{}))if(MENU_BY_ID[id])dishes[MENU_BY_ID[id].name]=(dishes[MENU_BY_ID[id].name]||0)+n;
    const r=b.req||{};diet.veg+=+r.veg||0;diet.vegan+=+r.vegan||0;diet.gf+=+r.gf||0;diet.baby+=+r.baby||0;
    const alg=allergyList(r);if(alg.length)al.push(`${esc(b.time)} ${esc(b.name)}: ${esc(alg.join(", "))}`);if(r.cake||(b.extras||[]).includes("x2"))cakes.push(`${esc(b.time)} ${esc(b.name)}`);if(r.notes)notes.push(`${esc(b.time)} ${esc(b.name)}: ${esc(r.notes)}`)}
  const ul=(o)=>Object.keys(o).length?`<ul>${Object.entries(o).map(([k,v])=>`<li><span>${esc(k)}</span><b>${v}</b></li>`).join("")}</ul>`:`<p class="note">אין</p>`;
  const ll=a=>a.length?`<ul>${a.map(x=>`<li><span>${x}</span></li>`).join("")}</ul>`:`<p class="note">אין</p>`;
  return`<div class="prep"><div><h3>מנות לפי חבילות</h3>${ul(pk)}</div><div><h3>מנות שהוזמנו מראש</h3>${ul(dishes)}</div>
   <div><h3>תזונה מיוחדת</h3><ul><li><span>צמחוני</span><b>${diet.veg}</b></li><li><span>טבעוני</span><b>${diet.vegan}</b></li><li><span>ללא גלוטן</span><b>${diet.gf}</b></li><li><span>כיסאות תינוק</span><b>${diet.baby}</b></li></ul></div>
   <div><h3 style="color:var(--bad)">אלרגיות</h3>${ll(al)}</div><div><h3>עוגות / הפתעות</h3>${ll(cakes)}</div><div><h3>הערות לצוות</h3>${ll(notes)}</div></div>`;
}

function availHtml(){
  const d=state.draft;if(!(+d.guests>0))return`<div class="verdict warn">הזינו מספר סועדים</div>`;
  const av=availability(d),fit=av.filter(a=>a.fits);const sel=av.find(a=>a.id===d.area);
  let v;
  if(sel&&sel.fits)v=`<div class="verdict ok"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12l5 5 9-10"/></svg>פנוי! ${d.guests} איש ב${esc(sel.name)}, ${fmtDate(d.date)} ב-${d.time}</div>`;
  else if(fit.length)v=`<div class="verdict ok"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12l5 5 9-10"/></svg>יש מקום ל-${d.guests} איש ב${fit.length} אזורים – בחרו אזור</div>`;

   <div class="panel">

    <div class="cal">${["א׳","ב׳","ג׳","ד׳","ה׳","ו׳","ש׳"].map(x=>`<div class="dow">${x}</div>`).join("")}${cells}</div>
   </div>
   <div class="panel">
    <div class="row"><h2>${fmtDate(state.calDay)}</h2><span class="spacer"></span><button class="btn sm red" data-act="new-on-day">+ הזמנה ליום הזה</button></div>

function bookingSheets(list,title){
  const c=state.cfg,rows=[...list].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const pkgName=b=>b.pkg==="est"?"שולחן רגיל (הערכה)":b.pkg==="alc"?"א-לה-קארט":((c.packages.find(p=>p.id===b.pkg)||{}).name||"");
  const cols=[{h:"תאריך",w:12,t:"d"},{h:"יום",w:8},{h:"שעה",w:7},{h:"משך (דק')",w:9,t:"n"},{h:"שם המזמין",w:26},{h:"טלפון",w:14},{h:"סוג האירוע",w:14},{h:"שולחן / אירוע",w:11},{h:"סועדים",w:8,t:"n"},{h:"מתוכם ילדים",w:9,t:"n"},{h:"אזור",w:12},{h:"תפריט / חבילה",w:18},{h:"תוספות",w:28},{h:"מנות שהוזמנו",w:28},{h:"הנחה %",w:8,t:"n"},{h:"שירות",w:7},{h:"סה\"כ",w:12,t:"c"},{h:"מקדמה ששולמה",w:13,t:"c"},{h:"יתרה לתשלום",w:13,t:"c"},{h:"סטטוס",w:13},{h:"אלרגיות",w:24},{h:"צמחונים",w:8,t:"n"},{h:"טבעונים",w:8,t:"n"},{h:"ללא גלוטן",w:9,t:"n"},{h:"כיסאות תינוק",w:9,t:"n"},{h:"עוגה",w:6},{h:"נגישות",w:7},{h:"הושבה",w:20},{h:"הערות לצוות",w:30},{h:"נוצר",w:12,t:"d"},{h:"עודכן",w:12,t:"d"}];
  const isoOf=ms=>ms?iso(new Date(ms)):"";
  const data=rows.map(b=>{const r=b.req||{},total=+b.total||calc(b).total,paid=+b.depositPaid||0,ar=cfgArea(b.area);
    return[b.date,DAYS[dObj(b.date).getDay()],b.time,+b.dur||c.dur,b.name,b.phone,b.occasion||"ארוחה רגילה",isEvent(b)?"אירוע":"שולחן",+b.guests||0,+b.kids||0,ar?ar.name:"",pkgName(b),
      (b.extras||[]).map(x=>(c.extras.find(e=>e.id===x)||{}).name).filter(Boolean).join(", "),
      Object.entries(b.dishes||{}).filter(([,n])=>n>0).map(([k,n])=>`${n}× ${(MENU_BY_ID[k]||{}).name||k}`).join(", "),
      +b.discount||0,b.service?"כן":"",total,paid,isCancel(b)?0:total-paid,b.status,allergyList(r).join(", "),+r.veg||0,+r.vegan||0,+r.gf||0,+r.baby||0,r.cake?"כן":"",r.access?"כן":"",seatingList(r).join(", "),r.notes||"",
      isoOf(b.createdAt),isoOf(b.updatedAt)]});
  const live=rows.filter(b=>!isCancel(b)),sum=f=>live.reduce((a,b)=>a+f(b),0);
  const tTotal=sum(b=>+b.total||0),tPaid=sum(b=>+b.depositPaid||0);
  const totals=cols.map((x,i)=>i===0?"סה\"כ (ללא מבוטלות)":i===8?sum(b=>+b.guests||0):i===16?tTotal:i===17?tPaid:i===18?tTotal-tPaid:"");
  // monthly summary
  const by={};for(const b of rows){const k=b.date.slice(0,7);(by[k]=by[k]||[]).push(b)}
  const mrows=Object.keys(by).sort().map(k=>{const all=by[k],l=all.filter(b=>!isCancel(b)),v=l.reduce((a,b)=>a+(+b.total||0),0),g=l.reduce((a,b)=>a+(+b.guests||0),0),p=l.reduce((a,b)=>a+(+b.depositPaid||0),0);const[y,m]=k.split("-").map(Number);
    return[`${MONTHS[m-1]} ${y}`,l.length,l.filter(isEvent).length,g,v,g?Math.round(v/g):0,p,v-p,all.length-l.length]});
  const mcols=[{h:"חודש",w:16},{h:"הזמנות",w:9,t:"n"},{h:"אירועים",w:9,t:"n"},{h:"סועדים",w:9,t:"n"},{h:"שווי",w:13,t:"c"},{h:"ממוצע לסועד",w:12,t:"c"},{h:"מקדמות ששולמו",w:14,t:"c"},{h:"יתרה",w:13,t:"c"},{h:"בוטלו",w:8,t:"n"}];
  return[{name:"הזמנות",cols,rows:data,totals:data.length?totals:null},{name:"סיכום חודשי",cols:mcols,rows:mrows}];
}
async function exportExcel(list,label){
  if(!list.length){toast("אין הזמנות לייצוא");return}
  let blob;try{blob=XLSX_W.build(bookingSheets(list,label))}catch(e){toast("יצירת הקובץ נכשלה");return}

const BACKUP_TAG="mila-house-bookings";
async function exportBackup(){
  const body={app:BACKUP_TAG,version:1,exportedAt:new Date().toISOString(),config:state.cfg,bookings:state.bookings.map(b=>clone(b))};
  await saveFile(`גיבוי MILA HOUSE ${today()}.json`,new Blob([JSON.stringify(body,null,1)],{type:"application/json"}));
}
function parseBackup(text){
  let j;try{j=JSON.parse(text)}catch(e){throw new Error("הקובץ לא קריא – בחרו קובץ גיבוי ‎.json‎")}
  if(!j||j.app!==BACKUP_TAG||!Array.isArray(j.bookings))throw new Error("זה לא קובץ גיבוי של המערכת");
  if(j.bookings.length>5000)throw new Error("הקובץ גדול מדי");
  const list=[];for(const b of j.bookings){if(!b||typeof b!=="object")continue;const id=String(b.id||"").replace(/[^A-Za-z0-9_-]/g,"").slice(0,60);
    if(!id||!/^\d{4}-\d{2}-\d{2}$/.test(String(b.date||"")))continue;const r=clone(b);r.id=id;list.push(r)}
  const cfg=j.config&&typeof j.config==="object"&&Array.isArray(j.config.areas)?j.config:null;
  return{list,cfg,exportedAt:j.exportedAt||""};
}
function askRestore(file){
  const rd=new FileReader();rd.onload=()=>{let r;try{r=parseBackup(String(rd.result))}catch(e){toast(e.message);return}
    if(!r.list.length&&!r.cfg){toast("אין בקובץ הזמנות לשחזור");return}
    state.pendingRestore=r;const when=r.exportedAt?new Date(r.exportedAt).toLocaleString("he-IL",{dateStyle:"short",timeStyle:"short"}):"";
    $("#modal").dataset.id="";
    $("#modal").innerHTML=`<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-modal="true" aria-label="שחזור מגיבוי">
     <div class="row"><h2>שחזור מגיבוי</h2><button class="x" data-act="close" aria-label="סגור">×</button></div>
     <p style="margin:0">בקובץ ${r.list.length} הזמנות${r.cfg?" והגדרות מסעדה":""}${when?` (נשמר ב-${esc(when)})`:""}.</p>

     ${r.cfg?`<label class="check"><input type="checkbox" id="rs-cfg" checked><span class="grow">לשחזר גם את ההגדרות (אזורים, חבילות, מחירים)</span></label>`:""}

const VIEWS={today:viewToday,new:viewNew,calendar:viewCalendar,list:viewList,settings:viewSettings};
function render(){
  const sy=window.scrollY,fid=document.activeElement&&document.activeElement.id;let sel=null;try{sel=fid&&[document.activeElement.selectionStart,document.activeElement.selectionEnd]}catch(e){}
  $("#app").innerHTML=VIEWS[state.tab]();
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===state.tab?"page":"false"));

  if(t.dataset.rstep){const k=t.dataset.rstep;d.req[k]=Math.max(0,(+d.req[k]||0)+(+t.dataset.d1));$("#r-"+k).value=d.req[k];saveDraft();refreshNew();return}
  if(t.dataset.allergy){const s=new Set(d.req.allergyTags||[]);s.has(t.dataset.allergy)?s.delete(t.dataset.allergy):s.add(t.dataset.allergy);d.req.allergyTags=[...s];saveDraft();refreshNew();return}
  if(t.dataset.seat){const s=new Set(d.req.seatingTags||[]);s.has(t.dataset.seat)?s.delete(t.dataset.seat):s.add(t.dataset.seat);d.req.seatingTags=[...s];saveDraft();refreshNew();return}
  if(t.dataset.area){if(t.getAttribute("aria-disabled")==="true"){toast("האזור הזה לא פנוי בשעה שנבחרה");return}d.area=t.dataset.area;d.areaManual=true;saveDraft();refreshNew();return}
  if(t.dataset.pkg){d.pkg=t.dataset.pkg;saveDraft();render();return}
  if(t.dataset.dish){const id=t.dataset.dish;d.dishes[id]=Math.max(0,(d.dishes[id]||0)+(+t.dataset.d1));if(!d.dishes[id])delete d.dishes[id];saveDraft();$("#dishes").innerHTML=dishesHtml();refreshNew();return}
  if(t.dataset.day){state.calDay=t.dataset.day;if(t.classList.contains("out"))state.calMonth=t.dataset.day.slice(0,7);render();return}
  if(t.dataset.cal!==undefined){const k=+t.dataset.cal;if(!k){state.calMonth=today().slice(0,7);state.calDay=today()}else{const[y,m]=state.calMonth.split("-").map(Number);const x=new Date(y,m-1+k,1);state.calMonth=x.getFullYear()+"-"+pad(x.getMonth()+1)}render();return}
  if(t.dataset.lf){state.listFilter=t.dataset.lf;render();return}
  if(t.dataset.open){openBooking(t.dataset.open);return}
  if(t.dataset.status){const id=$("#modal").dataset.id,b=state.bookings.find(x=>x.id===id);if(!b)return;try{await store.save({...b,status:t.dataset.status});toast("סטטוס: "+t.dataset.status)}catch(e){}return}
  const act=t.dataset.act;if(!act)return;
  if(act==="close"){if(ev.target===t||t.classList.contains("x"))closeModal();return}
  if(act==="ask-del"){$("#delZone").innerHTML=`<div class="confirm"><span>למחוק את ההזמנה לצמיתות? (אפשר גם לסמן "בוטל")</span><button class="btn sm red" data-act="do-del">כן, מחק</button><button class="btn sm" data-act="cancel-del">חזור</button></div>`;return}
  if(act==="cancel-del"){openBooking($("#modal").dataset.id);return}
  if(act==="do-del"){const id=$("#modal").dataset.id;closeModal();try{await store.remove(id);toast("ההזמנה נמחקה")}catch(e){}return}
  if(act==="edit"){const b=state.bookings.find(x=>x.id===$("#modal").dataset.id);if(!b)return;state.draft={...blankDraft(),...clone(b),req:{...blankDraft().req,...(b.req||{})},areaManual:true};saveDraft();go("new");return}
  if(act==="copy-booking"){const b=state.bookings.find(x=>x.id===$("#modal").dataset.id);if(b)copyText(confirmText(b));return}
  if(act==="copy-draft"){copyText(confirmText(state.draft));return}
  if(act==="new-blank"){state.draft=blankDraft();saveDraft();render();return}
  if(act==="new-on-day"){state.draft={...blankDraft(),date:state.calDay};autoArea();saveDraft();go("new");return}
  if(act==="save"){const err=canSave();if(err){toast(err);return}const c=calc(d);const rec={...clone(d),total:c.total};delete rec.areaManual;delete rec.createdBy;if(!rec.id)delete rec.id;
    const old=d.id&&state.bookings.find(b=>b.id===d.id);if(old){rec.createdAt=old.createdAt}
    t.disabled=true;try{const id=await store.save(rec);toast(d.id?"ההזמנה עודכנה ביומן ✓":"ההזמנה נסגרה ונשמרה ביומן ✓");state.calDay=rec.date;state.calMonth=rec.date.slice(0,7);state.draft=blankDraft();saveDraft();go("calendar");setTimeout(()=>openBooking(id),50)}catch(e){t.disabled=false}return}
  if(act==="cfg-reset"){try{await store.saveCfg(clone(DEFAULT_CFG));toast("ההגדרות הוחזרו")}catch(e){}render();return}
  if(act==="suggest-cake"){d.req.cake=true;if(!d.extras.includes("x2"))d.extras=[...d.extras,"x2"];saveDraft();render();toast("סומן עוגה + נוספה לתוספות");return}
  if(act==="help"){openHelp();return}
  if(act==="export-list"){const lab={upcoming:"קרובות",events:"אירועים",pending:"ממתינות",past:"עבר",all:"הכול"}[state.listFilter]||"";
    t.disabled=true;await exportExcel(state.listRes||[],lab+(state.q.trim()?` – ${state.q.trim()}`:"")+` ${shortDate(today()).replace("/","-")}`);t.disabled=false;return}
  if(act==="export-month"){const[y,m]=state.calMonth.split("-").map(Number);t.disabled=true;await exportExcel(state.bookings.filter(b=>(b.date||"").startsWith(state.calMonth)),`${MONTHS[m-1]} ${y}`);t.disabled=false;return}
  if(act==="logout"){store.logout();return}
  if(act==="export-backup"){t.disabled=true;await exportBackup();t.disabled=false;return}
  if(act==="do-restore"){const r=state.pendingRestore;if(!r)return;const withCfg=r.cfg&&$("#rs-cfg")&&$("#rs-cfg").checked;t.disabled=true;
    try{await store.importAll(r.list,withCfg?r.cfg:null);state.pendingRestore=null;closeModal();toast(`שוחזרו ${r.list.length} הזמנות ✓`)}catch(e){t.disabled=false;toast("השחזור נכשל – נסו שוב")}return}
  if(act==="export-all"){t.disabled=true;await exportExcel(state.bookings,`גיבוי מלא ${today()}`);t.disabled=false;return}
});
function openHelp(){lsSet("lucia.guideSeen",true);
  $("#modal").dataset.id="";
  $("#modal").innerHTML=`<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-modal="true" aria-label="מדריך שימוש">
   <div class="row"><h2>איך עובדים עם האפליקציה</h2><button class="x" data-act="close" aria-label="סגור">×</button></div>
   <div class="help-step"><i>1</i><div><b>לקוח מתקשר?</b><span>לוחצים "הזמנה חדשה" (הכפתור האדום), בוחרים תאריך, שעה ומספר סועדים. האפליקציה אומרת מיד אם יש מקום ובאיזה אזור.</span></div></div>
   <div class="help-step"><i>2</i><div><b>בונים מחיר</b><span>בוחרים חבילה או "שולחן רגיל", מוסיפים תוספות או מנות — הסכום הסופי מתעדכן תמיד בצד (או למטה בטלפון).</span></div></div>
   <div class="help-step"><i>3</i><div><b>בקשות מיוחדות</b><span>אלרגיות, צמחונים וסידורי ישיבה — לוחצים על הכפתורים המתאימים, לא צריך להקליד.</span></div></div>
   <div class="help-step"><i>4</i><div><b>סוגרים</b><span>"סגור הזמנה ושמור ביומן" — זהו, זה נכנס ליומן המשותף וכל הצוות רואה את זה מיד.</span></div></div>
   <div class="help-step"><i>5</i><div><b>יומן וחיפוש</b><span>בלשונית "יומן" רואים כל תאריך: כמה אנשים, כמה שווה, ומה המטבח צריך להכין. בלשונית "חיפוש" מוצאים הזמנה לפי שם או טלפון כשלקוח מתקשר לשנות.</span></div></div>
   <div class="help-step"><i>6</i><div><b>ייצוא לאקסל</b><span>בחיפוש מורידים את הרשימה שמסוננת כרגע, ביומן את כל החודש, ובהגדרות גיבוי של כל ההזמנות. הקובץ כולל גם לשונית סיכום לפי חודש.</span></div></div>
   <button class="btn primary lg" data-act="close">הבנתי, בואו נתחיל</button>
  </div></div>`;
}
function autoArea(){const d=state.draft;const av=availability(d);const cur=av.find(a=>a.id===d.area);
  if(cur&&cur.fits)return;if(d.areaManual&&cur&&cur.fits)return;
  const fit=av.filter(a=>a.fits);if(!fit.length){if(!d.areaManual)d.area=null;return}
  // prefer the smallest exclusive room for big groups, otherwise the area with most free seats
  const big=+d.guests>=state.cfg.eventFrom&&fit.find(a=>a.exclusive);d.area=(big||fit.sort((a,b)=>b.free-a.free)[0]).id;d.areaManual=false}
document.addEventListener("input",ev=>{
  const el=ev.target,d=state.draft;
  if(el.id==="q"){state.q=el.value;const pos=el.selectionStart;render();const q=$("#q");q.focus();q.setSelectionRange(pos,pos);return}
  if(el.dataset.d){const k=el.dataset.d;let v=el.type==="checkbox"?el.checked:el.value;if(["guests","kids","dur","discount","depositPaid"].includes(k))v=+v||0;d[k]=v;
    if(["date","time","dur","guests"].includes(k))autoArea();saveDraft();if(k==="date"||k==="occasion")render();else refreshNew();return}
  if(el.dataset.r){const k=el.dataset.r;d.req[k]=el.type==="checkbox"?el.checked:(["veg","vegan","gf","baby"].includes(k)?+el.value||0:el.value);saveDraft();refreshNew();return}
  if(el.dataset.extra){const s=new Set(d.extras);el.checked?s.add(el.dataset.extra):s.delete(el.dataset.extra);d.extras=[...s];saveDraft();refreshNew();return}
});
document.addEventListener("focusout",ev=>{
  const el=ev.target,d=state.draft;if(!el.dataset||!el.dataset.d)return;const k=el.dataset.d;
  const clamp={guests:[1,200],kids:[0,d.guests],discount:[0,50],depositPaid:[0,999999]}[k];if(!clamp)return;
  const v=Math.max(clamp[0],Math.min(clamp[1],+el.value||clamp[0]));if(v!==d[k]||el.value===""){d[k]=v;saveDraft();refreshNew()}
});
document.addEventListener("submit",async ev=>{ev.preventDefault();const f=ev.target;if(f.id!=="cfgForm")return;const fd=new FormData(f),c=clone(state.cfg);
  c.areas=c.areas.map((a,i)=>({...a,name:fd.get("a-n-"+i)||a.name,cap:Math.max(1,+fd.get("a-c-"+i)||a.cap),exclusive:fd.get("a-x-"+i)==="on"}));
  c.packages=c.packages.map((p,i)=>({...p,name:fd.get("p-n-"+i)||p.name,pp:+fd.get("p-p-"+i)||0}));
  c.extras=c.extras.map((x,i)=>({...x,name:fd.get("e-n-"+i)||x.name,price:+fd.get("e-p-"+i)||0}));
  for(const k of["dur","estSpend","kidsPrice","service","depositPct","eventFrom"])c[k]=+fd.get(k)||0;
  try{await store.saveCfg(c);state.cfg={...clone(DEFAULT_CFG),...c};toast("ההגדרות נשמרו לכל הצוות ✓");render()}catch(e){}});
document.addEventListener("change",ev=>{if(ev.target.id==="restoreFile"){const f=ev.target.files&&ev.target.files[0];ev.target.value="";if(f)askRestore(f)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#modal").innerHTML)closeModal()});

const h=(location.hash||"").slice(1);if(VIEWS[h])state.tab=h;
document.getElementById("loginForm").addEventListener("submit",ev=>{ev.preventDefault();ev.stopPropagation();
  if($("#lg-btn").dataset.mode==="retry"){location.reload();return}
  const em=$("#lg-email").value,pw=$("#lg-pass").value;if(!em.trim()||!pw){$("#lg-err").textContent="הקלידו אימייל וסיסמה";return}store.login(em,pw)});
render();store.init();
if(!FB_READY&&!lsGet("lucia.guideSeen",false))setTimeout(openHelp,500);
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
